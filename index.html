 pts:['ดูผลต่างของตัวที่ติดกัน ถ้าเท่ากันทุกครั้ง: ลำดับที่ n = ผลต่าง × n + ค่าปรับ','จำนวนกำลังสอง 1, 4, 9, 16 = n × n · จำนวน 2, 6, 12, 20 = n × (n + 1)','ผลบวกจำนวนคี่ n ตัวแรก = n × n','วันในสัปดาห์วนทุก 7 วัน: ใช้เศษจากการหารด้วย 7'],
 key:['3, 7, 11, 15 → 4n − 1','รูปไม้ขีดสามเหลี่ยม n รูป → 2n + 1 ก้าน'],
 tip:'หากฎแล้วลองแทน n = 1, 2, 3 ว่าตรงกับโจทย์ไหม ก่อนหาลำดับไกล ๆ'},
{id:'m7',sub:'m',art:'tri',title:'มุม เส้นขนาน และรูปหลายเหลี่ยม',tps:['มุมและรูปสามเหลี่ยม','เส้นขนานและมุม'],
 std:'สาระที่ 2 การวัดและเรขาคณิต · ป.4–ป.6',
 why:'ออกทั้งคำนวณมุมตรง ๆ และมุมเข็มนาฬิกาที่มีกับดัก',
 pts:['มุมในสามเหลี่ยมรวม 180° · มุมในสี่เหลี่ยมรวม 360°','รูป n เหลี่ยม มุมภายในรวม (n − 2) × 180°','สามเหลี่ยมหน้าจั่ว มุมที่ฐานเท่ากัน','เส้นขนานถูกตัด: มุมแย้งเท่ากัน · มุมภายในข้างเดียวกันรวม 180°','มุมภายนอกของสามเหลี่ยม = ผลบวกมุมภายในที่ไม่ติดกัน'],
 key:['เข็มยาว: นาทีละ 6° · เข็มสั้น: ชั่วโมงละ 30° และนาทีละ 0.5°'],
 tip:'วาดรูปเองทุกครั้ง แล้วเขียนขนาดมุมที่รู้ลงไป จะเห็นทางคิดเร็วขึ้น'},
{id:'m8',sub:'m',art:'cookie',title:'พื้นที่ ความยาวรอบรูป และวงกลม',tps:['พื้นที่','วงกลม'],
 std:'สาระที่ 2 การวัดและเรขาคณิต · ป.4–ป.6',
 why:'โจทย์ "พื้นที่ส่วนที่เหลือ" และทางเดินรอบสนาม เป็นโจทย์คิดหลายขั้นที่ออกบ่อย',
 pts:['สี่เหลี่ยมผืนผ้า = กว้าง × ยาว · สามเหลี่ยม = 1/2 × ฐาน × สูง','สี่เหลี่ยมด้านขนาน = ฐาน × สูง · คางหมู = 1/2 × (ผลบวกด้านคู่ขนาน) × สูง','เส้นรอบวง = 2πr · พื้นที่วงกลม = πr² (π ≈ 22/7 หรือ 3.14)','พื้นที่ส่วนที่แรเงา = รูปใหญ่ − รูปเล็ก','ครึ่งวงกลม: ความยาวรอบรูปต้องบวกเส้นผ่านศูนย์กลางด้วย'],
 key:['ล้อหมุน 1 รอบ = เส้นรอบวง 1 รอบ'],
 tip:'โจทย์ให้เส้นผ่านศูนย์กลางมา ต้องหารสองเป็นรัศมีก่อนเสมอ'},
{id:'m9',sub:'m',art:'box',title:'ปริมาตรและความจุ',tps:['ปริมาตร'],
 std:'สาระที่ 2 การวัดและเรขาคณิต · ป.5–ป.6',
 why:'ออกเป็นโจทย์ตู้ปลา แท็งก์น้ำ หย่อนหิน และลูกบาศก์ทาสี',
 pts:['ปริมาตรทรงสี่เหลี่ยมมุมฉาก = กว้าง × ยาว × สูง','1,000 ลูกบาศก์เซนติเมตร = 1 ลิตร · 1 ลูกบาศก์เมตร = 1,000 ลิตร','หย่อนวัตถุลงน้ำ ปริมาตรวัตถุ = ปริมาตรน้ำที่สูงขึ้น','ลูกบาศก์ n × n × n ทาสีด้านนอก → ไม่ถูกทาสีเลย (n − 2)³ ลูก'],
 key:['ลูกบาศก์มีพื้นที่ผิว 6 หน้าเท่ากัน'],
 tip:'แปลงหน่วยให้เหมือนกันก่อนคูณ เช่น เมตรทั้งหมด หรือเซนติเมตรทั้งหมด'},
{id:'m10',sub:'m',art:'car',title:'ค่าเฉลี่ย ความเร็ว ระยะทาง เวลา',tps:['ค่าเฉลี่ย','ความเร็ว ระยะทาง เวลา'],
 std:'สาระที่ 3 สถิติและความน่าจะเป็น · สาระที่ 2 การวัด · ป.5–ป.6',
 why:'ออกเป็นโจทย์ "ต้องได้กี่คะแนนให้เฉลี่ยถึง" และรถสองคันวิ่งพร้อมกัน',
 pts:['ค่าเฉลี่ย = ผลรวม ÷ จำนวนข้อมูล → ผลรวม = ค่าเฉลี่ย × จำนวน','ระยะทาง = อัตราเร็ว × เวลา','แปลงนาทีเป็นชั่วโมง: 15 นาที = 0.25 · 30 นาที = 0.5 · 45 นาที = 0.75 ชั่วโมง','ไปทางเดียวกัน: ห่างกันเพิ่มขึ้นเท่าผลต่างของอัตราเร็ว · สวนกัน: ใช้ผลบวก'],
 key:['ข้อมูลตัวใหม่ = ค่าเฉลี่ยใหม่ × จำนวนใหม่ − ผลรวมเดิม'],
 tip:'30 นาทีไม่ใช่ 0.3 ชั่วโมง เป็นกับดักที่เจอบ่อยมาก'},
// ---------------- วิทยาศาสตร์ ----------------
{id:'s1',sub:'s',art:'heart',title:'ร่างกายมนุษย์',tps:['ระบบย่อยอาหาร','ระบบหมุนเวียนเลือด','ระบบหายใจ','ระบบขับถ่าย'],
 std:'สาระที่ 1 วิทยาศาสตร์ชีวภาพ · ระบบย่อยอาหาร ป.6 (ระบบหมุนเวียนเลือด หายใจ ขับถ่าย เป็นเนื้อหา ม.ต้น ที่ จภ. ออก)',
 why:'เป็นบทชีววิทยาที่ออกเยอะที่สุด ต้องรู้ว่าอวัยวะไหนทำหน้าที่อะไร',
 pts:['ย่อยอาหาร: ปาก (แป้ง) → กระเพาะ (โปรตีน) → ลำไส้เล็ก (ย่อยครบ + ดูดซึม) → ลำไส้ใหญ่ (ดูดน้ำ)','น้ำดีสร้างที่ตับ เก็บที่ถุงน้ำดี ช่วยให้ไขมันแตกตัว','หัวใจ 4 ห้อง · หลอดเลือดแดงนำเลือดออกจากหัวใจ · หลอดเลือดดำนำกลับเข้าหัวใจ','เม็ดเลือดแดงขนออกซิเจน · เม็ดเลือดขาวสู้เชื้อโรค · เกล็ดเลือดช่วยให้เลือดแข็งตัว','หายใจเข้า: กะบังลมลง ซี่โครงยกขึ้น · แลกเปลี่ยนแก๊สที่ถุงลม · ไตกรองของเสียเป็นปัสสาวะ'],
 key:['ไขมัน 9 · คาร์โบไฮเดรต 4 · โปรตีน 4 กิโลแคลอรีต่อกรัม'],
 tip:'วาดผังเส้นทางอาหารหรือเลือดเป็นลูกศร จะจำลำดับได้ดีกว่าท่อง'},
{id:'s2',sub:'s',art:'plant',title:'พืช: สังเคราะห์ด้วยแสง ลำเลียง สืบพันธุ์',tps:['การสังเคราะห์ด้วยแสง','การลำเลียงในพืช','การสืบพันธุ์ของพืช'],
 std:'สาระที่ 1 วิทยาศาสตร์ชีวภาพ · ป.4–ป.6 (การสังเคราะห์ด้วยแสงแบบละเอียด ต่อยอด ม.1)',
 why:'จภ. ชอบออกเป็นการทดลอง เช่น ทดสอบแป้งด้วยไอโอดีน นับฟองแก๊สจากสาหร่าย',
 pts:['สังเคราะห์ด้วยแสง: น้ำ + คาร์บอนไดออกไซด์ + แสง (คลอโรฟิลล์) → น้ำตาล + ออกซิเจน','ทดสอบแป้งด้วยไอโอดีน → สีน้ำเงินเข้ม (ต้องเก็บต้นไว้ในที่มืดก่อน เพื่อให้แป้งเดิมหมด)','ไซเลม: ลำเลียงน้ำจากรากขึ้น · โฟลเอ็ม: ลำเลียงอาหารจากใบ','ถ่ายเรณู = เรณูตกบนยอดเกสรเพศเมีย · รังไข่ → ผล · ออวุล → เมล็ด'],
 key:['ฟองแก๊สจากพืชน้ำคือออกซิเจน: ฟองมาก = สังเคราะห์มาก'],
 tip:'โจทย์การทดลอง ให้หาก่อนว่าเปลี่ยนอะไร (ตัวแปรต้น) และวัดอะไร (ตัวแปรตาม)'},
{id:'s3',sub:'s',art:'chain',title:'ระบบนิเวศและโซ่อาหาร',tps:['โซ่อาหาร','ระบบนิเวศ','ความสัมพันธ์ของสิ่งมีชีวิต','การปรับตัวของสิ่งมีชีวิต'],
 std:'สาระที่ 1 วิทยาศาสตร์ชีวภาพ · ป.4–ป.6',
 why:'เป็นบทที่ต้องเน้นตามโครงสร้างข้อสอบ มักให้สายใยอาหารแล้วถามว่าถ้าตัวหนึ่งหายไปจะเกิดอะไร',
 pts:['ผู้ผลิต (พืช) → ผู้บริโภคลำดับ 1, 2, 3 … · ผู้ย่อยสลาย: เห็ด รา แบคทีเรีย','พลังงานลดลงเมื่อผ่านแต่ละลำดับ · สารพิษสะสมมากที่ผู้บริโภคลำดับสุดท้าย','ตัวหนึ่งหายไป: เหยื่อของมันเพิ่มขึ้น · ผู้ล่าของมันลดลง','ได้ทั้งคู่ = พึ่งพากัน · ได้–ไม่ได้ไม่เสีย = อิงอาศัย · ได้–เสีย = ปรสิต','การปรับตัว: กระบองเพชรใบเป็นหนาม ลดการคายน้ำ · หมีขั้วโลกขนหนา ไขมันมาก'],
 key:['ลูกศรชี้ไปหาผู้กิน: หญ้า → ตั๊กแตน'],
 tip:'โจทย์สายใยอาหาร ให้ใช้นิ้วไล่ลูกศรทีละเส้นว่าใครกินใคร'},
{id:'s4',sub:'s',art:'dna',title:'การจำแนกสิ่งมีชีวิตและพันธุกรรม',tps:['การจำแนกสิ่งมีชีวิต','การถ่ายทอดลักษณะทางพันธุกรรม'],
 std:'สาระที่ 1 วิทยาศาสตร์ชีวภาพ · ป.4–ป.6',
 why:'มักถามสัตว์ที่ชื่อหลอก เช่น วาฬ ค้างคาว ปลาตีน และลักษณะที่ถ่ายทอดหรือไม่ถ่ายทอด',
 pts:['สัตว์มีกระดูกสันหลัง 5 กลุ่ม: ปลา สะเทินน้ำสะเทินบก เลื้อยคลาน นก เลี้ยงลูกด้วยน้ำนม','วาฬ ค้างคาว = เลี้ยงลูกด้วยน้ำนม (มีขนหรือหายใจด้วยปอด เลี้ยงลูกด้วยนม)','ใบเลี้ยงเดี่ยว: เส้นใบขนาน รากฝอย · ใบเลี้ยงคู่: เส้นใบร่างแห รากแก้ว','เห็ดไม่ใช่พืช เพราะไม่มีคลอโรฟิลล์','ยีนบนโครโมโซมในนิวเคลียสควบคุมลักษณะ · รอยแผลเป็น สีผมที่ย้อม ไม่ถ่ายทอด'],
 key:['ลักษณะที่ถ่ายทอด: ติ่งหู ลักยิ้ม ห่อลิ้น หมู่เลือด'],
 tip:'จำแนกให้ดูลักษณะสำคัญ อย่าดูแค่ว่าอยู่ในน้ำหรือบินได้'},
{id:'s5',sub:'s',art:'push',title:'แรงและการเคลื่อนที่',tps:['แรงลัพธ์','แรงเสียดทาน','มวลและน้ำหนัก','แรงพยุง'],
 std:'สาระที่ 2 วิทยาศาสตร์กายภาพ · ป.4–ป.6',
 why:'ออกทั้งคำนวณแรงลัพธ์ น้ำหนักบนดวงจันทร์ และอธิบายการลอยการจม',
 pts:['แรงทิศเดียวกัน → บวกกัน · สวนทาง → ลบกัน ทิศตามแรงที่มากกว่า','วัตถุอยู่นิ่ง หรือเคลื่อนที่สม่ำเสมอ แรงลัพธ์ = 0','แรงเสียดทานมีทิศตรงข้ามการเคลื่อนที่ · ผิวเรียบหรือใส่ล้อ ช่วยลดแรงเสียดทาน','มวล (กิโลกรัม) ไม่เปลี่ยน · น้ำหนัก = มวล × g (นิวตัน) บนดวงจันทร์เหลือ 1/6','แรงพยุง = น้ำหนักในอากาศ − น้ำหนักในน้ำ · ลอยเมื่อแรงพยุง = น้ำหนัก'],
 key:['บนโลก g ≈ 10 นิวตันต่อกิโลกรัม','ของเหลวหนาแน่นมาก (น้ำเกลือ) → แรงพยุงมาก'],
 tip:'วาดลูกศรแรงลงบนกล่อง ลูกศรยาวแทนแรงมาก จะเห็นทิศของแรงลัพธ์ชัด'},
{id:'s6',sub:'s',art:'bulb',title:'ไฟฟ้าและแม่เหล็ก',tps:['วงจรไฟฟ้า','แม่เหล็ก','แม่เหล็กไฟฟ้า'],
 std:'สาระที่ 2 วิทยาศาสตร์กายภาพ · ป.3–ป.6',
 why:'โจทย์วงจรผสม (อนุกรม + ขนาน) แล้วถามว่าหลอดไหนดับ เป็นโจทย์คิดวิเคราะห์ที่ชอบออก',
 pts:['อนุกรม: ทางเดินเดียว หลอดหนึ่งขาด ดับหมด · ขนาน: หลายทาง หลอดหนึ่งขาด ที่เหลือยังติด','ถ่านต่ออนุกรม แรงดันรวม = ผลบวก (1.5 + 1.5 = 3 โวลต์)','ตัวนำไฟฟ้า: โลหะ · ฉนวน: ยาง พลาสติก ไม้ · ฟิวส์ตัดวงจรเมื่อกระแสมากเกิน','แม่เหล็กดูดเหล็ก นิกเกิล โคบอลต์ · ขั้วเหมือนผลัก ต่างดูด · ตัดครึ่งก็ยังมี 2 ขั้ว','แม่เหล็กไฟฟ้าแรงขึ้นเมื่อพันขดลวดมากรอบ หรือเพิ่มกระแส (ใช้ในกริ่งไฟฟ้า)'],
 key:['บ้านต่อแบบขนาน เพื่อให้แต่ละเครื่องเปิดปิดได้อิสระ'],
 tip:'ใช้นิ้วไล่ทางเดินไฟจากขั้วบวก ถ้ามีทางอื่นไปถึงขั้วลบได้ หลอดในทางนั้นยังติด'},
{id:'s7',sub:'s',art:'wave',title:'พลังงาน เสียง แสง ความร้อน',tps:['พลังงาน','เสียง','แสง','ความร้อน'],
 std:'สาระที่ 2 วิทยาศาสตร์กายภาพ · ป.4–ป.6',
 why:'เป็นบทที่ต้องเน้นตามโครงสร้างข้อสอบ มักถามการเปลี่ยนรูปพลังงาน และอธิบายปรากฏการณ์ในชีวิตประจำวัน',
 pts:['พัดลม: ไฟฟ้า → กล · เซลล์สุริยะ: แสง → ไฟฟ้า · เขื่อน: ศักย์ → จลน์ → ไฟฟ้า','พลังงานหมุนเวียน: ลม แสงอาทิตย์ น้ำ · ใช้แล้วหมด: ถ่านหิน น้ำมัน แก๊สธรรมชาติ','เสียงต้องมีตัวกลาง เดินทางในของแข็งดีที่สุด และไม่ผ่านสุญญากาศ · สั่นเร็ว = เสียงสูง','เห็นวัตถุเพราะแสงสะท้อนเข้าตา · ดินสอในน้ำดูหัก = การหักเห · วัตถุมีสีตามแสงที่สะท้อน','ความร้อน: นำ (ผ่านเนื้อของแข็ง) · พา (ของเหลว/แก๊สเคลื่อนที่ เช่น ลมทะเล) · แผ่รังสี'],
 key:['แสงเร็วกว่าเสียงมาก → เห็นฟ้าแลบก่อนได้ยินฟ้าร้อง'],

// ---------- คลังข้อสอบ ----------
const hash=s=>{let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)}return x>>>0};
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuffle=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const GEN={m:MG,s:SG,e:EG}; // วิชาที่มีตัวสร้างโจทย์ ได้ครบ 500 ข้อต่อเทอมและเรียงจากง่ายไปยาก
const fromRow=r=>({tp:r[1],lv:2,q:r[2],c:r[3],w:r[4],e:String(r[5]).split(' | ')});
const CACHE={};
function course(g,t,sub){
  const key=`${sub}${g}-${t}`;if(CACHE[key])return CACHE[key];
  const rows=(QB[`${sub}${g}base`]||[]).concat(QB[`${sub}${g}`]||[]).filter(r=>r[0]===t).map(fromRow);
  const G=GEN[sub],gen=!!(G&&G.courses.includes(`${g}-${t}`));
  const items=gen?G.build(`${g}-${t}`,TOTAL,rows):shuffle(rows,rng(hash(key)));
  const list=items.map((x,i)=>{const opts=shuffle([x.c,...x.w],rng(hash(key+i+x.q)));return {...x,i,sub,g,t,key,opts,ans:opts.indexOf(x.c)}});
  return CACHE[key]={key,g,t,sub,gen,list,stages:Math.ceil(list.length/SIZE)};
}
const keyParts=k=>{const m=/^([mse])(\d)-(\d)$/.exec(k);return m?[+m[2],+m[3],m[1]]:null};
const stageItems=(C,s)=>C.list.slice(s*SIZE,s*SIZE+SIZE);
const stageLv=(C,s)=>{const c=[0,0,0,0];stageItems(C,s).forEach(x=>c[x.lv]++);return c.indexOf(Math.max(...c))};
function stageState(C,s){
  const P=prog(C.key).p,it=stageItems(C,s);let done=0,ok=0;
  it.forEach(x=>{if(P[x.i]!==undefined){done++;if(P[x.i]===x.ans)ok++}});
  return {done,ok,n:it.length,full:done===it.length};
}
const starsFor=(ok,n)=>{const p=ok/n;return p>=.9?3:p>=.7?2:p>=.5?1:0};
const stageStars=(C,s)=>{const x=stageState(C,s);return x.full?starsFor(x.ok,x.n):0};
function courseStats(C){
  let done=0,ok=0,stars=0,passed=0;const P=prog(C.key).p;
  C.list.forEach(x=>{if(P[x.i]!==undefined){done++;if(P[x.i]===x.ans)ok++}});
  for(let s=0;s<C.stages;s++){const x=stageState(C,s);if(x.full){passed++;stars+=starsFor(x.ok,x.n)}}
  let next=0;while(next<C.stages&&stageState(C,next).full)next++;
  return {done,ok,stars,passed,next:Math.min(next,C.stages-1),allDone:next>=C.stages};
}
// ปลดล็อกด่านถัดไปเมื่อทำด่านก่อนหน้าครบ (ไม่จำกัดคะแนน)
const unlocked=(C,s)=>s===0||stageState(C,s-1).full||stageState(C,s).done>0;
function profileTotals(){
  const d=mine();let stars=0,answered=0,correct=0,passed=0,threeStar=0;const subs=new Set();
  for(const key of Object.keys(d.c)){const kp=keyParts(key);if(!kp)continue;const P=d.c[key].p||{};if(!Object.keys(P).length)continue;
    const C=course(...kp);subs.add(C.sub);
    C.list.forEach(x=>{if(P[x.i]!==undefined){answered++;if(P[x.i]===x.ans)correct++}});
    for(let s=0;s<C.stages;s++){const x=stageState(C,s);if(x.full){passed++;const st=starsFor(x.ok,x.n);stars+=st;if(st===3)threeStar++}}}
  if(d.xp===undefined)d.xp=correct*10+(answered-correct)*2;
  return {stars,answered,correct,passed,threeStar,subs:subs.size};
}
const level=xp=>{let l=1,need=150,left=xp;while(left>=need){left-=need;l++;need+=50}return {l,cur:left,need}};

let AC=null;
function sound(kind){
  if(!mine().snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const seq={ok:[[660,.08],[880,.12]],no:[[300,.12],[220,.16]],win:[[523,.1],[659,.1],[784,.1],[1047,.22]],badge:[[784,.08],[988,.08],[1319,.2]],tap:[[520,.04]]}[kind]||[];
  let t=AC.currentTime;for(const [f,d] of seq){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d}
}
function burst(x,y){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const fx=document.getElementById('fx');
  x=x??innerWidth/2;y=y??innerHeight/3;const cs=['#F5B400','#3B6FE0','#E8641B','#159A5B','#C2408F'];
  for(let i=0;i<22;i++){const e=document.createElement('i'),a=Math.random()*Math.PI*2,d=60+Math.random()*120;
    e.style.cssText=`left:${x}px;top:${y}px;background:${cs[i%5]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d+60}px`;fx.appendChild(e);setTimeout(()=>e.remove(),950)}
}

function mapView(){

  const wrong=C.list.filter(x=>P.p[x.i]!==undefined&&P.p[x.i]!==x.ans);
  const groups=[];for(let s=0;s<C.stages;s++){const lv=C.gen?stageLv(C,s):1;if(!groups.length||groups[groups.length-1].lv!==lv)groups.push({lv,s:[]});groups[groups.length-1].s.push(s)}
  const OFF=[0,34,48,34,0,-34,-48,-34];let n=0;
  const zones=groups.map(gp=>`<section class="zone z${gp.lv}"><h3>${ZONE[gp.lv].n}</h3><p class="zsub">${C.gen?ZONE[gp.lv].d:'ด่านฝึกทั่วไป'}</p><div class="path"><svg class="trail" aria-hidden="true"><path d=""/></svg>
    ${gp.s.map(s=>{const x=stageState(C,s),ok=unlocked(C,s),cur=!st.allDone&&s===st.next,stars=x.full?starsFor(x.ok,x.n):0,off=OFF[n++%OFF.length];

      return `<div style="display:flex;justify-content:center"><button class="node ${cls}" data-s="${s}" style="transform:translateX(${off*1.8}px)" aria-label="ด่าน ${s+1}${!ok?' ยังล็อกอยู่':''}">
        <span class="disc">${!ok?LOCK:s+1}</span><span class="stars">${x.full?[0,1,2].map(i=>STAR(i<stars)).join(''):cur?'<span class="cap">เล่นเลย</span>':x.done?`<span class="cap">${x.done}/${x.n}</span>`:''}</span></button></div>`}).join('')}</div></section>`).join('');
  app.innerHTML=`<div class="stack">
    <div class="top"><button class="btn ghost" id="back">← กลับ</button><span class="chip">${STAR(true,'ic')}${st.stars}/${C.stages*3}</span></div>
    <header class="row" style="gap:12px;flex-wrap:nowrap"><span class="glyph" style="width:56px;height:56px;border-radius:16px" data-k="${S.sub}">${SUBJ[S.sub].icon}</span><div><p class="label" style="margin:0">ป.${S.g} เทอม ${S.t}</p><h1 style="font-size:26px">${SUBJ[S.sub].name}</h1></div></header>
    ${st.allDone?`<p class="panel">ผ่านครบทุกด่านแล้ว เก่งสุด ๆ ลองเก็บดาวให้ครบ 3 ดวงทุกด่านดูนะ</p>`
      :`<button class="btn primary block" id="go">${stageState(C,st.next).done?`เล่นต่อ ด่าน ${st.next+1}`:`เริ่มด่าน ${st.next+1}`}</button>`}

      <button class="btn sm" id="lessons" style="flex:1">คัมภีร์ความรู้</button>

      <button class="btn sm" id="key" style="flex:1">เฉลยทั้งหมด</button>

  bindWho();

  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const s=+b.dataset.s;
    if(!unlocked(C,s)){sound('no');toast(`ผ่านด่าน ${s} ก่อน แล้วด่านนี้จะเปิด`);return}
    if(stageState(C,s).full){const items=stageItems(C,s);RUN={C,items,s,label:`ด่าน ${s+1}`,practice:false,picks:items.map(x=>P.p[x.i]),review:true};result();toTop()}

}
// เส้นทางประเชื่อมด่านในแต่ละโซน
function drawTrails(){
  app.querySelectorAll('.path').forEach(p=>{const box=p.getBoundingClientRect(),pts=[...p.querySelectorAll('.disc')].map(d=>{const r=d.getBoundingClientRect();return [r.left+r.width/2-box.left,r.top+r.height/2-box.top]});
    if(pts.length<2)return;let dd=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],my=(y0+y1)/2;dd+=` C${x0} ${my} ${x1} ${my} ${x1} ${y1}`}
    p.querySelector('.trail path').setAttribute('d',dd)});
}

let RUN=null;
function playStage(C,s){const items=stageItems(C,s),P=prog(C.key).p;let i=items.findIndex(x=>P[x.i]===undefined);if(i<0)i=0;
  RUN={C,items,s,i,label:`ด่าน ${s+1}`,practice:false,picks:items.map(x=>P[x.i]),combo:0,xp:0};sound('tap');question();toTop()}
function play(r){RUN={...r,i:0,picks:[],combo:0,xp:0};question();toTop()}
function award(good){
  const d=mine(),t=dayStr(),y=dayStr(new Date(Date.now()-864e5));
  const gain=good?10+Math.min(RUN.combo,5)*2:2;d.xp=(d.xp||0)+gain;RUN.xp+=gain;
  d.day=d.day&&d.day.d===t?{d:t,n:d.day.n+1}:{d:t,n:1};
  if(!d.streak||d.streak.d!==t)d.streak={d:t,n:d.streak&&d.streak.d===y?d.streak.n+1:1};
  if(RUN.combo>(d.best||0))d.best=RUN.combo;
  if(d.day.n===GOAL)setTimeout(()=>{toast('ครบเป้าหมายวันนี้แล้ว เยี่ยมมาก');sound('win');burst()},500);
  return gain;
}
function question(){
  const R=RUN,x=R.items[R.i],n=R.items.length,picked=R.picks[R.i];document.body.dataset.sub=x.sub;
  const segs=R.items.map((it,k)=>`<i class="${R.picks[k]===undefined?(k===R.i?'now':''):R.picks[k]===it.ans?'ok':'no'}"></i>`).join('');
  app.innerHTML=`
  <div class="qhead"><button class="btn ghost" id="quit" aria-label="ออก">✕</button><div class="segbar" style="--n:${n}">${segs}</div><span class="combo" id="combo">${R.combo>=2?`ถูกติดกัน ${R.combo}`:''}</span></div>
  <div class="qcard">
    <span class="tag">${esc(x.tp)}</span>${GEN[x.sub]&&x.lv?`<span class="tag ${x.lv===3?'lv3':''}">${LVN[x.lv]}</span>`:''}<span class="tag" style="background:var(--soft);color:var(--muted)">${R.label} · ข้อ ${R.i+1}/${n}</span>
    <p class="qtext">${fr(esc(x.q),x.sub)}</p>${figHTML(x)}
  </div>
  <div class="opts" id="opts">${x.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${K[k]}</span><span>${fr(esc(o),x.sub)}</span></button>`).join('')}</div>
  <div id="fb"></div>
  <div class="bar" id="bar"><span class="hint">แตะคำตอบที่คิดว่าถูก</span></div>`;
  const reveal=(k,fresh,gain)=>{const good=k===x.ans,btns=app.querySelectorAll('.opt');
    btns.forEach((b,j)=>{b.disabled=true;if(j===x.ans)b.classList.add('ok');else if(j===k)b.classList.add('no')});

      ${figHTML(x)}<p class="muted small" style="margin:8px 0">ตอบ ข้อ ${K[R.picks[k]]}. ${fr(esc(x.opts[R.picks[k]]),x.sub)}</p>${expHTML(x)}</details>`}).join('')}</div>

function jpSets(){
  if(JPSETS)return JPSETS;JPSETS={};const used=new Set();
  for(const r of [1,2])JP_GRADES.forEach((gs,n)=>{const R=JP_ROUNDS[r],items=[];

}

function jpStart(S){

const JP_UNIQUE=['x-2','x-1','x-4','x-5']; // ชุดเต็มใช้ข้อซ้ำกับชุดแยกวิชา จึงไม่นับซ้ำ
function jpGroupItems(gid){const out=[];JP_UNIQUE.forEach(id=>{const S=jpSets()[id];if(S)S.items.forEach(x=>{if(JP_TP2G[x.tp]===gid)out.push(x)})});return out}
function jpGroupStats(){
  const st={};JP_GROUPS.forEach(G=>st[G.id]={n:0,ok:0,done:0});
  JP_UNIQUE.forEach(id=>{const S=jpSets()[id];if(S)S.items.forEach(x=>{const g=JP_TP2G[x.tp];if(g)st[g].n++})});
  const A=jpData().ans||{};

  return st;
}

  document.getElementById('cp').onclick=async()=>{const t=document.getElementById('code');try{await navigator.clipboard.writeText(code);toast('คัดลอกรหัสแล้ว')}catch(e){t.focus();t.select();try{document.execCommand('copy');toast('คัดลอกรหัสแล้ว')}catch(_){toast('กดค้างที่กล่องรหัสแล้วเลือกคัดลอก')}}};
  const restore=s=>{const er=document.getElementById('rerr');let d;try{d=unpackDB(s)}catch(e){er.textContent='รหัสหรือไฟล์ไม่ถูกต้อง ลองคัดลอกใหม่ให้ครบทั้งหมด';return}
    if(!d||!Array.isArray(d.profiles)){er.textContent='ไม่พบข้อมูลผู้เล่นในรหัสนี้';return}
    if(!confirm('กู้คืนข้อมูลผู้เล่น '+d.profiles.length+' คน แทนที่ข้อมูลในเครื่องนี้ ตกลงไหม'))return;
    DB=d;DB.data=DB.data||{};if(!DB.profiles.some(p=>p.id===DB.cur))DB.cur=(DB.profiles[0]||{}).id;save();sound('win');toast('กู้คืนเรียบร้อย');profiles();toTop()};
  document.getElementById('rs').onclick=()=>restore(document.getElementById('paste').value);
  document.getElementById('file').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(fl)};
}
// ขอให้เบราว์เซอร์เก็บข้อมูลถาวร และเปิดโหมดออฟไลน์เมื่ออยู่บนเว็บของเราเอง
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/(^|\.)claude\.ai$/.test(location.hostname)&&!/claudeusercontent/.test(location.hostname))
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

home();
</script>
