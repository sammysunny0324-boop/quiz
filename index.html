<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผจญภัยแดนความรู้</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="แดนความรู้">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="ฝึกคณิต วิทย์ อังกฤษ ป.4–ป.6 และข้อสอบจำลองแนวสอบเข้า ม.1 จุฬาภรณราชวิทยาลัย แบบเกม">
<meta name="theme-color" content="#DDF1FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Sarabun:wght@400;600&display=swap">
<style>
/* Layout: phone-width column (max 640px). Home = hero with owl guide + player bar; subject = winding map of 25 stage nodes in 3 zones; quiz = card with sticky action bar. Accent follows subject. */
:root{
  --sky:#DDF1FF; --sky2:#F4FAFF; --card:#FFFFFF; --ink:#1C2540; --muted:#5A6684; --line:#D4DEEE; --soft:#EAF1FA;
  --m:#3B6FE0; --m-soft:#E3ECFF; --s:#159A5B; --s-soft:#DDF5E8; --e:#E8641B; --e-soft:#FFE9DA;
  --accent:var(--m); --accent-soft:var(--m-soft); --on-accent:#FFFFFF;
  --gold:#F5B400; --gold-soft:#FFF3C9; --ok:#159A5B; --ok-soft:#DDF5E8; --no:#D9483B; --no-soft:#FDE6E3;
  --z1:#7BD389; --z2:#4FB3A8; --z3:#F08A5D; --owl:#8A5A3C; --owl2:#C99572;
  --f-display:'Mali','Sarabun','Leelawadee UI','Thonburi','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'Sarabun','Leelawadee UI','Thonburi','Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#0F1A2E; --sky2:#13213A; --card:#1A2742; --ink:#EAF0FF; --muted:#A3B0CC; --line:#2D3C5C; --soft:#22314F;
  --m:#7EA6FF; --m-soft:#22335A; --s:#5ED39A; --s-soft:#173A2A; --e:#FFA36B; --e-soft:#43291A; --on-accent:#0F1A2E;
  --gold:#FFCB3D; --gold-soft:#3C3216; --ok:#5ED39A; --ok-soft:#173A2A; --no:#FF8A7E; --no-soft:#47201C;
  --z1:#4FA05C; --z2:#3A8C83; --z3:#C9663D; --owl:#C9956C; --owl2:#E7C29F; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#0F1A2E; --sky2:#13213A; --card:#1A2742; --ink:#EAF0FF; --muted:#A3B0CC; --line:#2D3C5C; --soft:#22314F;
  --m:#7EA6FF; --m-soft:#22335A; --s:#5ED39A; --s-soft:#173A2A; --e:#FFA36B; --e-soft:#43291A; --on-accent:#0F1A2E;
  --gold:#FFCB3D; --gold-soft:#3C3216; --ok:#5ED39A; --ok-soft:#173A2A; --no:#FF8A7E; --no-soft:#47201C;
  --z1:#4FA05C; --z2:#3A8C83; --z3:#C9663D; --owl:#C9956C; --owl2:#E7C29F; color-scheme:dark}
body[data-sub="e"]{--accent:var(--e);--accent-soft:var(--e-soft)}
body[data-sub="s"]{--accent:var(--s);--accent-soft:var(--s-soft)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--sky);background-image:radial-gradient(circle at 12% 8%,var(--sky2) 0 60px,transparent 61px),radial-gradient(circle at 88% 22%,var(--sky2) 0 40px,transparent 41px);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,7vw,34px)} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:14px}
.label{font-size:13px;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-family:var(--f-display);font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3A2A00;box-shadow:0 4px 0 #B98700}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;min-height:42px;padding-inline:8px;color:var(--muted);font-family:var(--f-body);font-weight:600}
.btn.sm{min-height:42px;padding:6px 14px;font-size:15px;border-radius:13px}
.ic{width:20px;height:20px;flex:none;vertical-align:-4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
/* แถบผู้เล่น */
.player{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 14px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:#fff;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.lvl{font-family:var(--f-display);font-weight:700;font-size:15px}
.xpbar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF9F1C);border-radius:5px}
.chips{display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--gold-soft);color:var(--ink);border-radius:999px;padding:3px 10px}
.chip.fire{background:var(--no-soft)}
/* มาสคอต */
.hero{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center}
.owl{width:110px;height:120px}
.owl.sm{width:64px;height:70px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-size:16px}
.bubble::before{content:"";position:absolute;left:-10px;top:26px;border:8px solid transparent;border-right-color:var(--line)}
.bubble b{font-family:var(--f-display)}
.goal{display:flex;align-items:center;gap:10px;margin-top:8px}
.goal .gb{flex:1;height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.goal .gb i{display:block;height:100%;background:var(--ok);border-radius:6px}
/* แท็บ */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:12px;min-height:44px;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
/* การ์ดวิชา */
.subs{display:grid;gap:12px}
.sub{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:12px 14px}
.sub:active{transform:translateY(2px)}
.sub[disabled]{opacity:.55;cursor:default}
.glyph{width:64px;height:64px;border-radius:18px;display:grid;place-items:center}
.glyph svg{width:40px;height:40px}
[data-k="m"] .glyph{background:var(--m-soft);color:var(--m)} [data-k="s"] .glyph{background:var(--s-soft);color:var(--s)} [data-k="e"] .glyph{background:var(--e-soft);color:var(--e)}
.sub>span:nth-child(2){display:flex;flex-direction:column;min-width:0}
.sub b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.25}
.meter{display:block;height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:4px}
[data-k="m"] .meter i{background:var(--m)} [data-k="s"] .meter i{background:var(--s)} [data-k="e"] .meter i{background:var(--e)}
.sstar{display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted)}
.sstar svg{width:28px;height:28px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
/* แผนที่ด่าน */
.zone{border-radius:24px;padding:16px 12px 20px;position:relative;overflow:hidden}
.zone.z1{background:color-mix(in srgb,var(--z1) 22%,var(--card))} .zone.z2{background:color-mix(in srgb,var(--z2) 22%,var(--card))} .zone.z3{background:color-mix(in srgb,var(--z3) 22%,var(--card))}
.zone h3{display:flex;align-items:center;gap:8px;margin:0 4px 6px}
.zone .zsub{font-size:14px;color:var(--muted);margin:0 4px 8px}
.path{position:relative}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.trail path{fill:none;stroke:var(--card);stroke-width:10;stroke-linecap:round;stroke-dasharray:2 16;opacity:.9}
.node{position:relative;display:flex;flex-direction:column;align-items:center;width:96px;margin:6px 0;border:0;background:transparent;padding:0}
.node .disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;background:var(--card);color:var(--ink);border:4px solid var(--line);box-shadow:0 5px 0 var(--line)}
.node.done .disc{background:var(--gold);border-color:#E09F00;color:#3A2A00;box-shadow:0 5px 0 #B98700}
.node.part .disc{border-color:var(--accent);border-style:dashed}
.node.low .disc{border-color:var(--no);color:var(--no)}
.node.cur .disc{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000);animation:bob 1.6s ease-in-out infinite}
.node.lock .disc{background:var(--soft);color:var(--muted);box-shadow:none}
.node.lock .disc svg{width:26px;height:26px}
.node .stars{display:flex;gap:1px;margin-top:4px;height:20px}
.node .stars svg{width:20px;height:20px}
.node .cap{font-size:12px;color:var(--muted);font-weight:600}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* แบบฝึก */
.qhead{display:flex;align-items:center;gap:10px}
.segbar{flex:1;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px}
.segbar i{height:10px;border-radius:5px;background:var(--line)}
.segbar i.ok{background:var(--ok)} .segbar i.no{background:var(--no)} .segbar i.now{background:var(--accent)}
.combo{font-family:var(--f-display);font-weight:700;color:#E8641B;font-size:15px;white-space:nowrap}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin-top:12px}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin:0 6px 8px 0;font-weight:600}
.tag.lv3{background:var(--gold-soft);color:#8A5A00}
.qtext{font-size:20px;font-weight:600;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
.fig{margin:12px 0 4px;background:var(--sky2);border-radius:16px;padding:8px}
.fg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;font-family:var(--f-body)}
.fg .ln,.fg .axis,.fg .tick{stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round}
.fg .tr{stroke:var(--accent)}
.fg .shape{stroke:var(--ink);stroke-width:2.2;fill:var(--accent-soft);stroke-linejoin:round}
.fg .face2{fill:color-mix(in srgb,var(--accent-soft) 70%,var(--card))} .fg .face3{fill:color-mix(in srgb,var(--accent-soft) 50%,var(--line))}
.fg .face{fill:var(--card);stroke:var(--ink);stroke-width:3}
.fg .hand{stroke:var(--ink);stroke-width:4;stroke-linecap:round} .fg .hand.h{stroke-width:6}
.fg .dot,.fg .pt{fill:var(--ink)}
.fg .arc{stroke:var(--accent);stroke-width:2.5;fill:none}
.fg .arc2,.fg .arc3{stroke:#E8641B;stroke-width:2.5;fill:none}
.fg .dash{stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4}
.fg .tickm{stroke:var(--ink);stroke-width:2;fill:none}
.fg text{font-size:15px;fill:var(--ink);font-weight:600}
.fg .lb{fill:var(--accent)} .fg .q{fill:#E8641B;font-size:18px;font-weight:700}
.fg .sm{font-size:13px;font-weight:500} .fg .num{font-size:15px} .fg .in{font-size:15px;fill:var(--muted)} .fg .pt-l{font-size:14px;fill:var(--muted)}
.fg .bar{fill:var(--accent)} .fg .plot{stroke:var(--accent);stroke-width:3;fill:none}
.fg .sl{stroke:var(--card);stroke-width:2} .fg .s0{fill:#5B8DEF} .fg .s1{fill:#F59E5B} .fg .s2{fill:#4CC38A} .fg .s3{fill:#F5C542} .fg .sl-t{font-size:13px;fill:#fff;font-weight:700}
.fg .water{fill:#7CC4F0;opacity:.75} .fg .cutaway{fill:none;stroke:var(--muted);stroke-dasharray:5 4} .fg .shade{fill:#F5B46B;opacity:.7}
.fgnote{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:58px;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:10px 14px;font-size:18px;line-height:1.45}
.opt .k{flex:none;width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.opt>span:last-child{min-width:0;overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-soft)} .opt.no .k{background:var(--no);color:#fff}
.opt[disabled]{cursor:default;opacity:1;color:inherit}
.opt.pop{animation:pop .35s ease} .opt.shake{animation:shake .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.verdict{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;margin:14px 0 8px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.xpfly{font-family:var(--f-display);font-weight:700;color:#C88400;font-size:15px;background:var(--gold-soft);border-radius:999px;padding:2px 10px}
.exp{background:var(--gold-soft);border-radius:16px;padding:12px 16px;font-size:16px}
.exp b{font-family:var(--f-display)}
.exp ol,.exp ul{margin:4px 0;padding-left:22px} .exp li{margin:2px 0}
.exp .ans{font-weight:600;margin-top:4px}
.bar{position:sticky;bottom:0;margin:18px calc(-1 * max(16px,env(safe-area-inset-left,0px))) -40px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--sky);border-top:2px solid var(--line);display:flex;gap:10px;align-items:center}
.bar .hint{flex:1;text-align:center;color:var(--muted);font-size:15px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.82em;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px} .fr>span:last-child{padding:0 3px}
/* ผลด่าน */
.win{text-align:center;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px 16px}
.bigstars{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}
.bigstars svg{width:64px;height:64px}
.bigstars svg:nth-child(2){width:80px;height:80px;margin-top:-12px}
.bigstars .on{animation:starIn .5s cubic-bezier(.3,1.6,.6,1) both}
.bigstars .on:nth-child(2){animation-delay:.25s} .bigstars .on:nth-child(3){animation-delay:.5s}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.rewards{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.bars{display:grid;gap:10px;font-size:15px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px 10px;align-items:center}
.brow .t{grid-column:1/-1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.brow .t i{display:block;height:100%;background:var(--ok)} .brow .t i.low{background:var(--no)}
.brow span:nth-child(2){text-align:right;color:var(--muted)}
details.rev{border-top:2px solid var(--line);padding:12px 0}
details.rev summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
details.rev summary::-webkit-details-marker{display:none}
.mk{flex:none;font-family:var(--f-display);font-weight:700;width:20px} .mk.ok{color:var(--ok)} .mk.no{color:var(--no)}
.rq{white-space:pre-line;min-width:0;overflow-wrap:anywhere}
.keyq{border-top:2px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:8px}
.keyq ul.ko{list-style:none;padding:0;margin:0;display:grid;gap:2px;font-size:16px} .keyq li.c{color:var(--ok);font-weight:600}
details.blk{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px}
details.blk>summary{cursor:pointer;font-family:var(--f-display);font-weight:700;list-style:none}
details.blk>summary::-webkit-details-marker{display:none}
.lesson{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.lesson ul{margin:0;padding-left:20px} .lesson li{margin:3px 0}
.lesson ul.tlist{list-style:none;padding:0;font-size:15px}
.tlist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:5px 0}
.tlist li span:first-child{min-width:0} .tlist li span:last-child{color:var(--muted);white-space:nowrap;font-size:14px}
.ex{background:var(--sky2);border-radius:14px;padding:12px 14px;font-size:16px}
.ex .q{font-weight:600;white-space:pre-line}
/* เหรียญรางวัล */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;font-size:14px}
.badge svg{width:54px;height:54px}
.badge b{display:block;font-family:var(--f-display);font-size:15px;margin-top:4px}
.badge.off{opacity:.45;filter:grayscale(1)}
/* ผู้เรียน */
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;min-height:52px;border:2px solid var(--line);border-radius:16px;padding:8px 14px;background:var(--card);font-size:18px}
.colors{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.colors button{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.err{color:var(--no);font-size:14px;min-height:20px}
.plist{display:grid;gap:10px}
.pbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:10px 14px;min-height:64px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);border-radius:999px;padding:9px 18px;font-size:15px;z-index:30;max-width:calc(100% - 32px);font-weight:600}
.fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.fx i{position:absolute;width:10px;height:10px;border-radius:2px;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:20px}
@media (prefers-reduced-motion: reduce){.node.cur .disc,.bigstars .on,.opt.pop,.opt.shake{animation:none}.fx{display:none}.btn,.sub{transition:none}}
@media (min-width:560px){.subs{grid-template-columns:repeat(3,minmax(0,1fr))}.sub{grid-template-columns:1fr;justify-items:center;text-align:center}.sub>span:nth-child(2){width:100%}}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .k{background:var(--accent);color:#fff}
.timer{font-family:var(--f-display);font-weight:700;font-size:20px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:2px 10px;font-variant-numeric:tabular-nums}
.timer.late{color:var(--no);border-color:var(--no)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:10px 0}
.qgrid button{min-height:38px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:14px;color:var(--muted)}
.qgrid button.s{border-style:dashed}
.qgrid button.done{background:var(--accent-soft);color:var(--ink)}
.qgrid button.now{border-color:var(--accent);border-style:solid;color:var(--accent)}
.jpbtn{gap:10px}.jpico{background:#3A2A00;color:var(--gold);border-radius:8px;padding:0 8px;font-size:15px}
.jpn{background:var(--gold-soft);color:#8A5A00;font-family:var(--f-display);font-weight:700;font-size:28px}.jpn:not(:empty){line-height:1}[data-set^="x-"] .jpn{font-size:18px}
.jplist{grid-template-columns:1fr !important}
.jplist .sub{grid-template-columns:64px minmax(0,1fr) auto !important;justify-items:stretch !important;text-align:left !important}
.jpbig{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1.1}.jpbig small{font-size:20px;color:var(--muted)}
.jpsplit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.jpsplit div{background:var(--soft);border-radius:14px;padding:8px}.jpsplit b{display:block;font-family:var(--f-display);font-size:20px}.jpsplit span{font-size:13px;color:var(--muted)}
.tlist a{color:var(--accent);font-weight:600}
.grow{display:grid;grid-template-columns:72px minmax(0,1fr) 16px;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:8px 12px;color:inherit}
.grow:active{transform:translateY(2px)}
.gthumb{display:block;width:72px;height:44px;border-radius:12px;overflow:hidden}.gthumb svg{display:block;width:100%;height:100%}
.gmain{display:flex;flex-direction:column;gap:4px;min-width:0}.gmain b{font-family:var(--f-display);font-size:16px;line-height:1.3}
.gbar{display:block;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.gbar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
[data-sub="s"] .gbar i{background:var(--s)}
.hot{background:var(--no-soft);color:var(--no);border-radius:999px;padding:0 8px;font-weight:700}
.lowtxt{color:var(--no)}.chev{font-size:24px;color:var(--muted)}
.jpguide{grid-template-columns:72px minmax(0,1fr) 16px !important;border-color:var(--gold);background:var(--gold-soft)}
.les-art svg{display:block;width:100%;height:auto;border-radius:22px;box-shadow:0 4px 0 var(--line)}
.stdchip{display:inline-block;margin-top:6px;font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:4px 10px;font-weight:600}
.why{border-color:var(--accent);background:var(--accent-soft)}.why p{margin-top:4px}
ol.pts{list-style:none;padding:0;margin:0;counter-reset:p;display:grid;gap:10px}
ol.pts li{counter-increment:p;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;line-height:1.55}
ol.pts li::before{content:counter(p);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--f-display);font-weight:700}
.keybox{background:var(--gold-soft);border:2px dashed var(--gold);border-radius:18px;padding:12px 16px}.keybox b{font-family:var(--f-display)}.keybox p{margin-top:6px;font-weight:600}
.okmark{color:var(--ok);font-weight:700}
.codebox{width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--soft);color:var(--ink);resize:vertical;word-break:break-all}
label.btn{cursor:pointer}
.prow{display:flex;gap:8px;align-items:center}.prow .pbtn{flex:1;min-width:0}.prow .pbtn[disabled]{opacity:.7}
.dangerbtn{background:var(--no-soft);border-color:var(--no);color:var(--no);box-shadow:0 3px 0 color-mix(in srgb,var(--no) 45%,transparent)}
.pdel{background:var(--no-soft);border:2px solid var(--no);border-radius:18px;padding:12px 14px;display:grid;gap:10px}
</style>

function makeR(seed){

function build(key,total,extra){
  const gens=COURSES[key];if(!gens)return [];
  const R=makeR(hash('eg1:'+key)),seen=new Set(),out={1:[],2:[],3:[]};const hand=[];
  (extra||[]).forEach(x=>{const k=x.q+'|'+x.c;if(!seen.has(k)){seen.add(k);hand.push(x)}});
  const topics=new Set();const probe=makeR(1);gens.forEach(g=>{for(let t=0;t<9;t++){let x=null;try{x=g[1](probe,g[0][t%g[0].length])}catch(e){}if(x){topics.add(x.tp);break}}});
  for(const lv of [1,2,3]){
    const list=gens.filter(g=>g[0].includes(lv)).map(g=>g[1]);
    const target=lv===1?Math.round(total*SHARE[1]):lv===2?Math.round(total*(SHARE[1]+SHARE[2]))-out[1].length-hand.length:total-out[1].length-out[2].length;
    let i=0,miss=0,cp=Math.ceil(target/Math.max(topics.size,1)*1.6);const gen=[],per={};
    while(gen.length<target&&miss<15000){const f=list[i++%list.length];let x=null;try{x=f(R,lv)}catch(e){x=null}
      if(!x){miss++;continue}const k=x.q+'|'+x.c;if(seen.has(k)||(per[x.tp]||0)>=cp){miss++;if(miss===5000)cp=Infinity;continue}
      seen.add(k);per[x.tp]=(per[x.tp]||0)+1;gen.push(x)}
    if(lv===2){const step=gen.length/(hand.length+1);let hi=0;gen.forEach((x,j)=>{while(hi<hand.length&&j>=step*(hi+1))out[2].push(hand[hi++]);out[2].push(x)});while(hi<hand.length)out[2].push(hand[hi++])}
    else out[lv]=gen;
  }
  return [...out[1],...out[2],...out[3]].slice(0,total);
}
function example(tp,key){const g=COURSES[key]||[];const R=makeR(hash('ex:'+tp));for(let t=0;t<900;t++){const f=g[t%g.length];if(!f)break;const lv=f[0].includes(2)?2:f[0][0];let x=null;try{x=f[1](R,lv)}catch(e){}if(x&&x.tp===tp)return x}return null}

// ส่วนโค้งของมุมจากทิศ a ถึง b (องศา ทวนเข็ม) รอบจุด (cx,cy)
function arc(cx,cy,a,b,r,c='arc'){const p=pt(cx,cy,a,r),q=pt(cx,cy,b,r),big=((b-a)%360+360)%360>180?1:0;return `<path class="${c}" d="M${p[0]} ${p[1]} A${r} ${r} 0 ${big} 0 ${q[0]} ${q[1]}"/>`}
function angLab(cx,cy,a,b,r,s){const m=a+(((b-a)%360+360)%360)/2;return txt(pt(cx,cy,m,r),s,s==='?'?'q':'lb')}
const svg=(w,h,body,note)=>`<svg class="fg" viewBox="0 0 ${w} ${h}" role="img" aria-label="รูปประกอบโจทย์">${body}</svg>${note?`<p class="fgnote">${note}</p>`:''}`;
// ย่อขยายความยาวจริงให้พอดีกรอบ
const fit=(a,b,maxA,maxB)=>{const k=Math.min(maxA/a,maxB/b);return [a*k,b*k]};

const D={
 ang({d}){const c=[160,105],L=95;let b=line(c,pt(...c,0,L))+line(c,pt(...c,d,L))+`<circle class="dot" cx="${c[0]}" cy="${c[1]}" r="3"/>`;
  b+=d===90?`<path class="arc" d="M${c[0]+16} ${c[1]} V${c[1]-16} H${c[0]}"/>`:arc(...c,0,d,28);b+=angLab(...c,0,d,d>180?48:52,`${d}°`);return svg(320,210,b)},
 line2({a}){const c=[160,120];let b=line([20,120],[300,120])+line(c,pt(...c,a,100))+arc(...c,0,a,30)+arc(...c,a,180,42,'arc2');
  b+=angLab(...c,0,a,56,`${a}°`)+angLab(...c,a,180,68,'?');return svg(320,150,b)},
 line3({a,b:bb}){const c=[160,125];let b=line([20,125],[300,125])+line(c,pt(...c,a,100))+line(c,pt(...c,a+bb,100));
  b+=arc(...c,0,a,30)+arc(...c,a,a+bb,40,'arc2')+arc(...c,a+bb,180,50,'arc3');b+=angLab(...c,0,a,50,`${a}°`)+angLab(...c,a,a+bb,62,`${bb}°`)+angLab(...c,a+bb,180,74,'?');return svg(320,150,b)},
 around({a,b:bb}){const c=[160,110];let b=[0,a,a+bb].map(t=>line(c,pt(...c,t,92))).join('');
  b+=arc(...c,0,a,26)+arc(...c,a,a+bb,36,'arc2')+arc(...c,a+bb,360,46,'arc3');b+=angLab(...c,0,a,48,`${a}°`)+angLab(...c,a,a+bb,58,`${bb}°`)+angLab(...c,a+bb,360,68,'?');return svg(320,220,b)},
 clock({h,m}){const c=[110,110];let b=`<circle class="face" cx="110" cy="110" r="92"/>`;
  for(let i=1;i<=12;i++)b+=txt(pt(...c,90-i*30,74),i,'num');for(let i=0;i<60;i+=5)b+=line(pt(...c,90-i*6,86),pt(...c,90-i*6,92),'tick');
  b+=line(c,pt(...c,90-(30*h+m/2),48),'hand h')+line(c,pt(...c,90-6*m,72),'hand')+`<circle class="dot" cx="110" cy="110" r="4"/>`;return svg(220,220,b)},
 rect({w,l,inner}){const [L,W]=fit(typeof l==='number'?l:w*1.6,w,240,120),x=(320-L)/2,y=(170-W)/2;
  let b=`<rect class="shape" x="${x}" y="${y}" width="${L}" height="${W}"/>`+txt([x+L/2,y+W+16],lab(l),cls(l))+txt([x-14,y+W/2],lab(w),cls(w),'end');if(inner)b+=txt([x+L/2,y+W/2],inner,'in');return svg(320,190,b)},
 sq(){const s=120,x=100,y=25;return svg(320,175,`<rect class="shape" x="${x}" y="${y}" width="${s}" height="${s}"/>`+txt([x+s/2,y+s+16],'?','q')+txt([x-14,y+s/2],'?','q','end'))},
 cut({W,L,a,b:bb}){const [Ls,Ws]=fit(L,W,240,130),k=Ls/L,x=(320-Ls)/2,y=20,cw=bb*k,ch=a*k;
  const P=[[x,y],[x+Ls-cw,y],[x+Ls-cw,y+ch],[x+Ls,y+ch],[x+Ls,y+Ws],[x,y+Ws]].map(p=>p.map(r1).join(',')).join(' ');
  let s=`<rect class="cutaway" x="${r1(x+Ls-cw)}" y="${y}" width="${r1(cw)}" height="${r1(ch)}"/><polygon class="shape" points="${P}"/>`;
  s+=txt([x+Ls/2,y+Ws+16],L)+txt([x-14,y+Ws/2],W,'lb','end')+txt([x+Ls-cw/2,y+ch/2],`ตัดออก ${bb}×${a}`,'sm');return svg(320,Ws+50,s)},
 bar({k,v,u}){const mx=Math.max(...v),bw=44,gap=26,x0=40,H=130;let b=line([30,20],[30,160],'axis')+line([30,160],[300,160],'axis');
  v.forEach((val,i)=>{const h=val/mx*H,x=x0+i*(bw+gap);b+=`<rect class="bar" x="${x}" y="${r1(160-h)}" width="${bw}" height="${r1(h)}" rx="4"/>`+txt([x+bw/2,r1(152-h)],val,'sm')+txt([x+bw/2,176],k[i],'sm')});return svg(320,190,b)},
 line({k,v}){const mx=Math.max(...v)*1.1,x0=40,dx=60,H=120,P=v.map((val,i)=>[x0+i*dx,r1(150-val/mx*H)]);let b=line([30,20],[30,150],'axis')+line([30,150],[300,150],'axis');
  b+=`<polyline class="plot" points="${P.map(p=>p.join(',')).join(' ')}"/>`;P.forEach((p,i)=>{b+=`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="4"/>`+txt([p[0],p[1]-12],v[i],'sm')+txt([p[0],166],k[i],'sm')});return svg(320,180,b)},
 pie({k,ps}){const c=[100,100],r=80;let a=90,b='';ps.forEach((p,i)=>{const s=a,e=a-p*3.6,P=pt(...c,s,r),Q=pt(...c,e,r),big=p>50?1:0;
   b+=`<path class="sl s${i}" d="M${c[0]} ${c[1]} L${P[0]} ${P[1]} A${r} ${r} 0 ${big} 1 ${Q[0]} ${Q[1]} Z"/>`;b+=txt(pt(...c,(s+e)/2,52),`${p}%`,'sl-t');a=e});
  k.forEach((n,i)=>{b+=`<rect class="sl s${i}" x="200" y="${40+i*30}" width="14" height="14" rx="3"/>`+txt([222,47+i*30],n,'sm','start')});return svg(320,200,b)},
 par({x,show,ask}){// เส้นขนาน 2 เส้น (บน: จุด P, ล่าง: จุด Q) และเส้นตัดทำมุมแหลม x กับแนวนอน
  const P=[170,60],dy=80,Q=[r1(170-dy/Math.tan(x*R)),140];
  const ends=[pt(...P,x,60),pt(...Q,180+x,60)];
  let b=line([20,60],[300,60])+line([20,140],[300,140])+line(ends[1],ends[0],'ln tr');
  b+=txt([16,60],'A','pt-l','end')+txt([304,60],'B','pt-l','start')+txt([16,140],'C','pt-l','end')+txt([304,140],'D','pt-l','start');
  const pos={ur:[0,x],ul:[x,180],ll:[180,180+x],lr:[180+x,360]};
  for(const [key,s,c] of [[show,`${x}°`,'arc'],[ask,'?','arc2']]){const at=key[0]==='p'?P:Q,[a1,a2]=pos[key.slice(1)];b+=arc(...at,a1,a2,22,c)+angLab(...at,a1,a2,38,s)}
  b+=`<path class="tickm" d="M150 54 l8 6 l-8 6 M150 134 l8 6 l-8 6"/>`;return svg(320,190,b)},
 para({b:bs,h}){const [B,H]=fit(bs,h,190,110),o=40,x=(320-B-o)/2,y=25;const P=[[x+o,y],[x+o+B,y],[x+B,y+H],[x,y+H]];
  let s=`<polygon class="shape" points="${P.map(p=>p.map(r1).join(',')).join(' ')}"/>`+line([x+o,y],[x+o,y+H],'dash')+txt([x+B/2,y+H+16],bs)+txt([x+o+8,y+H/2],h,'lb','start');return svg(320,H+55,s)},
 rhom({d1,d2}){const [A,B]=fit(d1,d2,240,140),c=[160,85];const P=[[c[0]-A/2,c[1]],[c[0],c[1]-B/2],[c[0]+A/2,c[1]],[c[0],c[1]+B/2]];
  let s=`<polygon class="shape" points="${P.map(p=>p.map(r1).join(',')).join(' ')}"/>`+line(P[0],P[2],'dash')+line(P[1],P[3],'dash')+txt([c[0]+A/4,c[1]-10],d1)+txt([c[0]+12,c[1]+B/4],d2,'lb','start');return svg(320,175,s)},
 trap({a,b:bb,h}){const [B,H]=fit(bb,h,240,110),k=B/bb,A=a*k,x=(320-B)/2,y=25,ox=(B-A)/2;const P=[[x+ox,y],[x+ox+A,y],[x+B,y+H],[x,y+H]];
  let s=`<polygon class="shape" points="${P.map(p=>p.map(r1).join(',')).join(' ')}"/>`+line([x+ox,y],[x+ox,y+H],'dash')+txt([x+ox+A/2,y-10],a)+txt([x+B/2,y+H+16],bb)+txt([x+ox+8,y+H/2],h,'lb','start');return svg(320,H+55,s)},
 quad({a,b:bb,c}){const P=[[60,150],[270,150],[240,40],[100,30]];let s=`<polygon class="shape" points="${P.map(p=>p.join(',')).join(' ')}"/>`;
  s+=txt([84,136],`${a}°`)+txt([246,136],`${bb}°`)+txt([226,56],`${c}°`)+txt([108,50],'?','q');return svg(320,175,s,'รูปนี้ไม่ได้วาดตามขนาดมุมจริง')},
 paraAng({x}){const B=180,H=90,o=r1(H/Math.tan(x*R)),X=(320-B-o)/2,y=25;const P=[[X+o,y],[X+o+B,y],[X+B,y+H],[X,y+H]];
  let s=`<polygon class="shape" points="${P.map(p=>p.map(r1).join(',')).join(' ')}"/>`+arc(X,y+H,0,x,24)+angLab(X,y+H,0,x,42,`${x}°`)+arc(X+B,y+H,x,180,24,'arc2')+angLab(X+B,y+H,x,180,40,'?');return svg(320,140,s)},
 tri({a,b:bb}){const ta=Math.tan(a*R),tb=Math.tan(bb*R);let B=240,hx=B*tb/(ta+tb),hy=hx*ta;if(hy>130){const k=130/hy;B*=k;hx*=k;hy=130}
  const x=(320-B)/2,y=hy+20,A=[x,y],Bp=[x+B,y],C=[r1(x+hx),r1(y-hy)];
  let s=`<polygon class="shape" points="${[A,Bp,C].map(p=>p.map(r1).join(',')).join(' ')}"/>`+arc(...A,0,a,22)+angLab(...A,0,a,40,`${a}°`)+arc(...Bp,180-bb,180,22)+angLab(...Bp,180-bb,180,40,`${bb}°`);
  s+=arc(...C,180+a,360-bb,20,'arc2')+angLab(...C,180+a,360-bb,36,'?');return svg(320,y+20,s)},
 poly({n}){const c=[160,95],r=80;const P=Array.from({length:n},(_,i)=>pt(...c,90+i*360/n,r));return svg(320,190,`<polygon class="shape" points="${P.map(p=>p.join(',')).join(' ')}"/>`+txt([160,95],`${n} เหลี่ยม`,'in'))},
 triBH({b:bs,h}){const [B,H]=fit(bs,typeof h==='number'?h:bs*.6,230,120),x=(320-B)/2,y=H+20,ax=x+B*.35;
  let s=`<polygon class="shape" points="${[[x,y],[x+B,y],[ax,y-H]].map(p=>p.map(r1).join(',')).join(' ')}"/>`+line([ax,y-H],[ax,y],'dash')+`<path class="arc" d="M${r1(ax)} ${r1(y-10)} h10 v10"/>`;
  s+=txt([x+B/2,y+16],bs)+txt([ax+8,y-H/2],lab(h),cls(h),'start');return svg(320,y+30,s)},
 rectDiag({w,l}){const [L,W]=fit(l,w,240,120),x=(320-L)/2,y=20;return svg(320,W+50,`<rect class="shape" x="${x}" y="${y}" width="${L}" height="${W}"/><polygon class="shade" points="${x},${y} ${x+L},${y+W} ${x},${y+W}"/>`+line([x,y],[x+L,y+W])+txt([x+L/2,y+W+16],l)+txt([x-12,y+W/2],w,'lb','end'))},
 circ({r}){const c=[160,95];return svg(320,190,`<circle class="shape" cx="160" cy="95" r="80"/>`+line(c,[240,95],'ln')+`<circle class="dot" cx="160" cy="95" r="3"/>`+txt([200,84],`r = ${r}`))},
 semi({r}){return svg(320,130,`<path class="shape" d="M60 110 A100 100 0 0 1 260 110 Z"/>`+line([160,110],[160+70.7,110-70.7],'dash')+`<circle class="dot" cx="160" cy="110" r="3"/>`+txt([212,62],`r = ${r}`))},
 box({w,l,h,fill}){const hv=typeof h==='number'?h:Math.max(w,l)*.5,k=Math.min(170/(l+w*.5),110/(hv+w*.4)),L=l*k,H=hv*k,dx=w*k*.5,dy=w*k*.35,x=(320-L-dx)/2,y=dy+20;
  const F=[[x,y],[x+L,y],[x+L,y+H],[x,y+H]],T=[[x,y],[x+dx,y-dy],[x+dx+L,y-dy],[x+L,y]],S=[[x+L,y],[x+L+dx,y-dy],[x+L+dx,y-dy+H],[x+L,y+H]];
  const pg=(p,c)=>`<polygon class="${c}" points="${p.map(q=>q.map(r1).join(',')).join(' ')}"/>`;let s='';
  if(fill){const fh=H*fill;s+=pg([[x,y+H-fh],[x+L,y+H-fh],[x+L,y+H],[x,y+H]],'water')+pg([[x+L,y+H-fh],[x+L+dx,y-dy+H-fh],[x+L+dx,y-dy+H],[x+L,y+H]],'water')}
  s+=pg(F,'shape')+pg(T,'shape face2')+pg(S,'shape face3');
  s+=txt([x+L/2,y+H+16],l)+txt([x+L+dx/2+10,y+H-dy/2+6],w,'lb','start')+txt([x-12,y+H/2],lab(h),cls(h),'end');return svg(320,y+H+30,s)},
 box2({l,w,h1,l2,h2}){const k=Math.min(180/(l+w*.5),120/(h1+h2+w*.4)),L=l*k,dx=w*k*.5,dy=w*k*.35,H1=h1*k,H2=h2*k,L2=l2*k,x=(320-L-dx)/2,y=dy+H2+20;
  const box=(x0,y0,Lb,Hb)=>{const pg=(p,c)=>`<polygon class="${c}" points="${p.map(q=>q.map(r1).join(',')).join(' ')}"/>`;return pg([[x0,y0],[x0+Lb,y0],[x0+Lb,y0+Hb],[x0,y0+Hb]],'shape')+pg([[x0,y0],[x0+dx,y0-dy],[x0+dx+Lb,y0-dy],[x0+Lb,y0]],'shape face2')+pg([[x0+Lb,y0],[x0+Lb+dx,y0-dy],[x0+Lb+dx,y0-dy+Hb],[x0+Lb,y0+Hb]],'shape face3')};
  let s=box(x,y,L,H1)+box(x,y-H2,L2,H2);s+=txt([x+L/2,y+H1+16],l)+txt([x-12,y+H1/2],h1,'lb','end')+txt([x-12,y-H2/2],h2,'lb','end')+txt([x+L2/2,y-H2-dy-8],l2,'sm');return svg(320,y+H1+30,s)}
};
// สามเหลี่ยมหน้าจั่ว: มุมยอดเป็นค่าที่โจทย์ให้ มุมฐานทั้งสองเป็น ?
D.iso=function({x}){const base=(180-x)/2,ta=Math.tan(base*R);let B=240,hx=B/2,hy=hx*ta;if(hy>130){const k=130/hy;B*=k;hx*=k;hy=130}
  const X=(320-B)/2,y=hy+20,A=[X,y],Bp=[X+B,y],C=[r1(X+hx),r1(y-hy)];
  let s=`<polygon class="shape" points="${[A,Bp,C].map(p=>p.map(r1).join(',')).join(' ')}"/>`+arc(...A,0,base,22,'arc2')+angLab(...A,0,base,40,'?')+arc(...Bp,180-base,180,22,'arc2')+angLab(...Bp,180-base,180,40,'?');
  s+=arc(...C,180+base,360-base,20)+angLab(...C,180+base,360-base,38,`${x}°`);
  s+=`<path class="tickm" d="M${r1((A[0]+C[0])/2-5)} ${r1((A[1]+C[1])/2-3)} l10 6 M${r1((Bp[0]+C[0])/2-5)} ${r1((Bp[1]+C[1])/2+3)} l10 -6"/>`;return svg(320,y+20,s)};
return {render:f=>{try{return D[f.t]?D[f.t](f):''}catch(e){return ''}}};
})();

'มุม':['มุมแหลม < 90° | มุมฉาก = 90° | มุมป้าน 90°–180° | มุมตรง = 180° | มุมกลับ > 180°','มุมบนเส้นตรงรวมกันได้ 180° และมุมรอบจุดรวมกันได้ 360°','หน้าปัดนาฬิกาแต่ละช่องตัวเลขห่างกัน 30° และเข็มสั้นเดิน 15° ทุก 30 นาที'],
'เส้นตรงและรังสี':['ส่วนของเส้นตรง AB มีจุดปลาย 2 จุด วัดความยาวได้','รังสี AB มีจุดปลายจุดเดียวคือ A แล้วยาวต่อไปทาง B อย่างไม่สิ้นสุด','เส้นตรง AB ไม่มีจุดปลาย ยาวไม่สิ้นสุดทั้งสองทาง','มุมเกิดจากรังสี 2 เส้นที่มีจุดปลายร่วมกัน จุดนั้นเรียกว่าจุดยอดมุม'],
'รูปสี่เหลี่ยมมุมฉาก':['รูปสี่เหลี่ยมมุมฉากมีมุมทั้งสี่เป็นมุมฉาก (90°)','สี่เหลี่ยมผืนผ้า: ด้านตรงข้ามยาวเท่ากัน','สี่เหลี่ยมจัตุรัส: ด้านทั้งสี่ยาวเท่ากัน'],
'การคูณ':['แยกตัวคูณเป็นหลักสิบกับหลักหน่วย แล้วคูณทีละส่วน จากนั้นนำมาบวกกัน','คูณด้วย 10 เติม 0 หนึ่งตัว คูณด้วย 100 เติม 0 สองตัว','สลับที่การคูณได้ เช่น 25 × 4 × 37 = 100 × 37'],
'การหาร':['หารยาวทีละหลักจากซ้ายไปขวา: หาร คูณ ลบ แล้วดึงหลักถัดไปลงมา','ตัวตั้ง = ตัวหาร × ผลหาร + เศษ และเศษต้องน้อยกว่าตัวหาร','ตรวจคำตอบด้วยการคูณกลับ'],
'โจทย์ปัญหาการคูณการหาร':['มีหลายกลุ่ม กลุ่มละเท่ากัน → คูณ','แบ่งออกเป็นกลุ่มละเท่า ๆ กัน → หาร','ถ้าโจทย์ถามว่า “อย่างน้อยกี่คัน” และหารมีเศษ ต้องปัดผลหารขึ้นอีก 1'],
'การบวก ลบ คูณ หารระคน':['ทำในวงเล็บก่อน','จากนั้นทำการคูณและการหาร จากซ้ายไปขวา','สุดท้ายทำการบวกและการลบ จากซ้ายไปขวา'],
'เศษส่วน':['เศษส่วนแท้: ตัวเศษน้อยกว่าตัวส่วน | เศษเกิน: ตัวเศษมากกว่าหรือเท่ากับตัวส่วน','จำนวนคละ → เศษเกิน: จำนวนเต็ม × ตัวส่วน + ตัวเศษ','เศษเกิน → จำนวนคละ: นำตัวเศษหารด้วยตัวส่วน ผลหารเป็นจำนวนเต็ม เศษเป็นตัวเศษ'],
'เศษส่วนที่เท่ากัน':['คูณหรือหารทั้งตัวเศษและตัวส่วนด้วยจำนวนเดียวกัน จะได้เศษส่วนที่เท่ากัน','เศษส่วนอย่างต่ำ: หารทั้งเศษและส่วนด้วย ห.ร.ม. ของทั้งสองจำนวน'],
'การเปรียบเทียบเศษส่วน':['ตัวส่วนเท่ากัน: ตัวเศษมากกว่า มีค่ามากกว่า','ตัวส่วนไม่เท่ากัน: ทำตัวส่วนให้เท่ากันก่อน แล้วจึงเทียบตัวเศษ'],
'การบวกลบเศษส่วน':['ตัวส่วนเท่ากัน: บวกหรือลบเฉพาะตัวเศษ ตัวส่วนคงเดิม','ตัวส่วนไม่เท่ากัน: ใช้ ค.ร.น. ของตัวส่วนเป็นตัวส่วนร่วมก่อน','จำนวนคละ: บวกจำนวนเต็มกับเศษส่วนแยกกัน หรือเขียนเป็นเศษเกินก่อนก็ได้','อย่าบวกตัวส่วนเข้าด้วยกัน และตอบเป็นเศษส่วนอย่างต่ำ'],
'โจทย์ปัญหาเศษส่วน':['“เศษส่วน ของ จำนวน” หมายถึงการคูณ เช่น 2/5 ของ 40 = 40 ÷ 5 × 2 = 16','ส่วนที่เหลือ = ทั้งหมด (1) − ส่วนที่ใช้ไป','โจทย์ “...ของเงินที่เหลือ” ต้องหาเงินที่เหลือก่อน แล้วจึงคิดเศษส่วนต่อ'],
'เวลา':['1 ชั่วโมง = 60 นาที | 1 วัน = 24 ชั่วโมง | 1 สัปดาห์ = 7 วัน | 1 ปี = 12 เดือน','บวกเวลา: บวกชั่วโมงกับนาทีแยกกัน ถ้านาทีเกิน 60 ให้ทดเป็น 1 ชั่วโมง','หาระยะเวลา: นับจากเวลาเริ่มไปถึงชั่วโมงเต็มถัดไป แล้วนับต่อจนถึงเวลาสิ้นสุด'],
'ความยาวรอบรูป':['ความยาวรอบรูปคือผลรวมความยาวทุกด้าน','สี่เหลี่ยมผืนผ้า = 2 × (กว้าง + ยาว) | สี่เหลี่ยมจัตุรัส = 4 × ด้าน','ถ้ารู้ความยาวรอบรูปกับความกว้าง: ยาว = (รอบรูป ÷ 2) − กว้าง'],
'พื้นที่':['สี่เหลี่ยมผืนผ้า = กว้าง × ยาว | สี่เหลี่ยมจัตุรัส = ด้าน × ด้าน','หน่วยของพื้นที่คือ ตารางหน่วย เช่น ตร.ซม. ตร.ม.','รูปที่ถูกตัดมุม: พื้นที่ทั้งหมด − พื้นที่ส่วนที่ตัดออก'],
'ทศนิยม':['ตำแหน่งที่หนึ่ง = ส่วนสิบ | ตำแหน่งที่สอง = ส่วนร้อย | ตำแหน่งที่สาม = ส่วนพัน','เปรียบเทียบทศนิยม: เติม 0 ให้จำนวนตำแหน่งเท่ากันก่อน แล้วเทียบทีละหลัก','0.5 = 0.50 = 0.500 มีค่าเท่ากัน'],
'การบวกลบทศนิยม':['ตั้งจุดทศนิยมให้ตรงกัน','เติม 0 ให้จำนวนตำแหน่งทศนิยมเท่ากัน','บวกลบเหมือนจำนวนนับ แล้วใส่จุดทศนิยมตรงตำแหน่งเดิม'],
'การอ่านแผนภูมิ':['อ่านชื่อแผนภูมิและหน่วยก่อนเสมอ','มากที่สุด/น้อยที่สุด: ดูแท่งที่สูงที่สุด/ต่ำที่สุด','“มากกว่ากี่...” ใช้การลบ | “รวมทั้งหมด” ใช้การบวกทุกแท่ง'],
'การคูณเศษส่วน':['คูณตัวเศษกับตัวเศษ และตัวส่วนกับตัวส่วน','จำนวนคละต้องเขียนเป็นเศษเกินก่อนคูณ','ตัดทอนก่อนคูณได้ เพื่อให้ตัวเลขเล็กลง'],
'การหารเศษส่วน':['การหารด้วยเศษส่วน = การคูณด้วยส่วนกลับของตัวหาร เช่น ÷ 3/4 = × 4/3','จำนวนคละต้องเขียนเป็นเศษเกินก่อน','หา □ จาก □ × a/b = c ได้จาก □ = c ÷ a/b'],
'ค่าประมาณทศนิยม':['ประมาณเป็นจำนวนเต็ม: ดูทศนิยมตำแหน่งที่หนึ่ง','ประมาณเป็นทศนิยม 1 ตำแหน่ง: ดูตำแหน่งที่สอง | 2 ตำแหน่ง: ดูตำแหน่งที่สาม','5 ขึ้นไปปัดขึ้น น้อยกว่า 5 ปัดทิ้ง ระวังการทดเมื่อหลักนั้นเป็น 9'],
'ทศนิยมกับเศษส่วน':['เศษส่วน → ทศนิยม: ทำตัวส่วนให้เป็น 10, 100 หรือ 1000','ทศนิยม → เศษส่วน: เขียนตัวส่วนตามจำนวนตำแหน่ง แล้วทำเป็นอย่างต่ำ','ควรจำ: 1/2 = 0.5, 1/4 = 0.25, 3/4 = 0.75, 1/5 = 0.2, 1/8 = 0.125'],
'การคูณทศนิยม':['คูณเหมือนจำนวนนับก่อน','จำนวนตำแหน่งทศนิยมของผลคูณ = ผลรวมตำแหน่งทศนิยมของตัวตั้งและตัวคูณ','คูณด้วย 10, 100, 1000 เลื่อนจุดไปทางขวา 1, 2, 3 ตำแหน่ง'],
'การหารทศนิยม':['หารด้วยจำนวนนับ: หารเหมือนจำนวนนับ แล้วใส่จุดทศนิยมให้ตรงกับตัวตั้ง','หารด้วยทศนิยม: คูณทั้งตัวตั้งและตัวหารด้วย 10, 100 จนตัวหารเป็นจำนวนนับ','หารด้วย 10, 100 เลื่อนจุดไปทางซ้าย 1, 2 ตำแหน่ง'],
'เส้นขนานและมุม':['เส้นขนานอยู่ห่างกันเท่ากันตลอดและไม่ตัดกัน ใช้สัญลักษณ์ //','มุมแย้งมีขนาดเท่ากัน','มุมภายในบนข้างเดียวกันของเส้นตัดรวมกันได้ 180°','มุมภายนอกกับมุมภายในที่อยู่ตรงข้ามบนข้างเดียวกันของเส้นตัดมีขนาดเท่ากัน'],
'ร้อยละ':['ร้อยละ a หมายถึง a/100','ร้อยละ a ของ n = a/100 × n','a คิดเป็นร้อยละเท่าใดของ b = a/b × 100','ราคาหลังลด = ราคาเดิม − ส่วนลด'],
'พื้นที่รูปสี่เหลี่ยม':['สี่เหลี่ยมด้านขนาน = ฐาน × สูง','สี่เหลี่ยมขนมเปียกปูน = 1/2 × เส้นทแยงมุม × เส้นทแยงมุม','สี่เหลี่ยมคางหมู = 1/2 × ผลบวกด้านคู่ขนาน × สูง'],
'มุมภายในรูปสี่เหลี่ยม':['มุมภายในของรูปสี่เหลี่ยมทุกรูปรวมกันได้ 360°','สี่เหลี่ยมด้านขนาน: มุมตรงข้ามเท่ากัน มุมที่อยู่ติดกันรวมกันได้ 180°'],
'ปริมาตรและความจุ':['ปริมาตรทรงสี่เหลี่ยมมุมฉาก = กว้าง × ยาว × สูง','1 ลิตร = 1,000 ลูกบาศก์เซนติเมตร = 1,000 มิลลิลิตร','ระดับน้ำที่สูงขึ้น = ปริมาตรน้ำ ÷ (กว้าง × ยาว ของก้นภาชนะ)'],
'การอ่านกราฟเส้น':['แกนนอนมักเป็นเวลา แกนตั้งเป็นปริมาณ','เส้นขึ้น = เพิ่มขึ้น เส้นลง = ลดลง เส้นชันมาก = เปลี่ยนแปลงมาก','หาการเปลี่ยนแปลงด้วยการลบค่าของสองช่วงเวลา'],
'ห.ร.ม.':['ห.ร.ม. คือตัวหารร่วมที่มากที่สุด','หาได้ด้วยการแยกตัวประกอบ หรือการหารสั้น','โจทย์ “ตัดให้ยาวเท่ากันและยาวที่สุด” หรือ “แบ่งให้มากที่สุด” ใช้ ห.ร.ม.'],
'ค.ร.น.':['ค.ร.น. คือพหุคูณร่วมที่น้อยที่สุด','ห.ร.ม. × ค.ร.น. = ผลคูณของสองจำนวน','โจทย์ “เกิดพร้อมกันอีกครั้ง” หรือ “น้อยที่สุดที่หารลงตัว” ใช้ ค.ร.น.'],
'เศษส่วนระคน':['ทำในวงเล็บก่อน แล้วคูณหาร จากนั้นจึงบวกลบ','การหารเศษส่วนเปลี่ยนเป็นคูณด้วยส่วนกลับ','ตอบเป็นเศษส่วนอย่างต่ำหรือจำนวนคละ'],
'อัตราส่วน':['อัตราส่วนที่เท่ากัน: คูณหรือหารทั้งสองจำนวนด้วยจำนวนเดียวกัน','อัตราส่วนอย่างต่ำ: หารทั้งสองจำนวนด้วย ห.ร.ม.','แบ่งในอัตราส่วน a : b → หาค่า 1 ส่วน = ทั้งหมด ÷ (a + b)'],
'แบบรูปและลำดับ':['หาว่าแต่ละจำนวนเพิ่มหรือลดทีละเท่าใด หรือคูณด้วยเท่าใด','ลำดับที่เพิ่มทีละ d เริ่มจาก a: จำนวนลำดับที่ n = a + (n − 1) × d'],
'มุมในรูปสามเหลี่ยมและรูปหลายเหลี่ยม':['มุมภายในรูปสามเหลี่ยมรวมกันได้ 180°','สามเหลี่ยมหน้าจั่ว: มุมที่ฐานเท่ากัน 2 มุม','มุมภายในรูป n เหลี่ยมรวมกันได้ (n − 2) × 180°'],
'โจทย์ปัญหาร้อยละ':['กำไร = ราคาขาย − ทุน | ขาดทุน = ทุน − ราคาขาย','ร้อยละของกำไรหรือขาดทุน คิดจากราคาทุนเสมอ','ลดราคาร้อยละ a แปลว่าจ่ายร้อยละ (100 − a) ของราคาเดิม'],
'พื้นที่รูปสามเหลี่ยม':['พื้นที่ = 1/2 × ฐาน × สูง','ความสูงต้องตั้งฉากกับฐาน','เส้นทแยงมุมแบ่งสี่เหลี่ยมผืนผ้าเป็นสามเหลี่ยม 2 รูปที่มีพื้นที่เท่ากัน'],
'วงกลม':['เส้นผ่านศูนย์กลาง = 2 × รัศมี','เส้นรอบวง = 2 × π × รัศมี | พื้นที่ = π × รัศมี × รัศมี','ใช้ π ≈ 22/7 เมื่อรัศมีหารด้วย 7 ลงตัว จะคำนวณง่าย'],
'ปริมาตรรูปเรขาคณิตสามมิติ':['ปริมาตรทรงสี่เหลี่ยมมุมฉาก = กว้าง × ยาว × สูง','รูปที่ประกอบกัน: แยกเป็นทรงสี่เหลี่ยมมุมฉากหลายก้อน แล้วนำปริมาตรมารวมกัน','1 ลิตร = 1,000 ลบ.ซม.'],
'แผนภูมิรูปวงกลม':['วงกลมทั้งวง = ร้อยละ 100 = 360°','จำนวนของแต่ละส่วน = ร้อยละ × ทั้งหมด ÷ 100','มุมที่จุดศูนย์กลาง = ร้อยละ × 360° ÷ 100'],
'ค่าเฉลี่ย':['ค่าเฉลี่ย = ผลรวมของข้อมูลทั้งหมด ÷ จำนวนข้อมูล','ผลรวม = ค่าเฉลี่ย × จำนวนข้อมูล ใช้หาข้อมูลที่หายไป'],
// ---------- วิทยาศาสตร์ ----------
'ทักษะกระบวนการทางวิทยาศาสตร์':['ตัวแปรต้น: สิ่งที่เราตั้งใจเปลี่ยนในการทดลอง','ตัวแปรตาม: ผลที่เกิดขึ้นและเราวัดหรือสังเกต','ตัวแปรควบคุม: สิ่งที่ต้องทำให้เหมือนกันทุกชุด เพื่อให้การทดลองยุติธรรม','วิธีจำ: “เปลี่ยน → วัด → คุม”'],
'ส่วนต่าง ๆ ของพืช':['ราก: ดูดน้ำและธาตุอาหาร ยึดลำต้น | ลำต้น: ลำเลียงน้ำและอาหาร ชูกิ่งก้านใบ','ใบ: สร้างอาหารด้วยแสง น้ำ แก๊สคาร์บอนไดออกไซด์ และคลอโรฟิลล์ ได้น้ำตาลและแก๊สออกซิเจน','ดอก: สืบพันธุ์ | ผล: ห่อหุ้มเมล็ด | เมล็ด: งอกเป็นต้นใหม่','พืชต้องการ น้ำ แสง อากาศ และธาตุอาหาร ในการเจริญเติบโต'],
'การจำแนกสิ่งมีชีวิต':['แบ่งเป็น พืช สัตว์ และกลุ่มที่ไม่ใช่พืชและสัตว์ (เห็ด รา ยีสต์ แบคทีเรีย)','พืชดอก/พืชไม่มีดอก (เฟิน มอส สน ปรง) | ใบเลี้ยงเดี่ยว: เส้นใบขนาน รากฝอย | ใบเลี้ยงคู่: เส้นใบร่างแห รากแก้ว','สัตว์มีกระดูกสันหลัง 5 กลุ่ม: ปลา สัตว์สะเทินน้ำสะเทินบก สัตว์เลื้อยคลาน นก สัตว์เลี้ยงลูกด้วยน้ำนม','ระวังตัวหลอก: ค้างคาว วาฬ โลมา เป็นสัตว์เลี้ยงลูกด้วยน้ำนม | เพนกวินเป็นนก | หมึก ปู กุ้ง ไม่มีกระดูกสันหลัง'],
'สมบัติของวัสดุ':['ความแข็ง: ทดสอบโดยขูดขีด วัสดุที่แข็งกว่าทำให้อีกชิ้นเป็นรอย','สภาพยืดหยุ่น: เปลี่ยนรูปเมื่อมีแรงกระทำ และกลับคืนรูปเดิมเมื่อหยุดแรง เช่น ยาง สปริง','โลหะนำความร้อนและนำไฟฟ้าได้ดี | ไม้ พลาสติก ยาง ผ้า นำความร้อนไม่ดีและเป็นฉนวนไฟฟ้า','เลือกวัสดุให้เหมาะกับการใช้งาน เช่น ด้ามกระทะใช้วัสดุที่นำความร้อนไม่ดี'],
'สถานะของสสาร':['สสาร: สิ่งที่มีมวล ต้องการที่อยู่ และสัมผัสได้','ของแข็ง: รูปร่างและปริมาตรคงที่ อนุภาคชิดกันมาก','ของเหลว: ปริมาตรคงที่ รูปร่างเปลี่ยนตามภาชนะ','แก๊ส: รูปร่างและปริมาตรเปลี่ยนตามภาชนะ อนุภาคห่างกันมาก'],
'แรงโน้มถ่วง มวลและน้ำหนัก':['แรงโน้มถ่วงของโลกดึงวัตถุเข้าหาศูนย์กลางของโลก','น้ำหนัก = แรงโน้มถ่วงที่กระทำต่อวัตถุ หน่วยนิวตัน วัดด้วยเครื่องชั่งสปริง','มวล = ปริมาณเนื้อสาร หน่วยกิโลกรัม ไม่เปลี่ยนตามสถานที่','บนดวงจันทร์ น้ำหนักเหลือประมาณ 1/6 ของบนโลก แต่มวลเท่าเดิม | มวลมาก ความเฉื่อยมาก'],
'แสงและการมองเห็น':['แสงเคลื่อนที่เป็นเส้นตรงออกจากแหล่งกำเนิดทุกทิศทาง','วัตถุโปร่งใส: แสงผ่านเกือบหมด | โปร่งแสง: ผ่านบางส่วน | ทึบแสง: ผ่านไม่ได้ เกิดเงา','เรามองเห็นวัตถุเมื่อแสงจากวัตถุ หรือแสงที่สะท้อนจากวัตถุ เข้าสู่ตา','ไฟฉายยิ่งใกล้วัตถุ เงายิ่งใหญ่'],
'ดวงจันทร์':['ดวงจันทร์ไม่มีแสงในตัวเอง เห็นได้เพราะสะท้อนแสงอาทิตย์','ข้างขึ้น: ส่วนสว่างเพิ่มขึ้น จนเต็มดวงวันขึ้น 15 ค่ำ | ข้างแรม: ส่วนสว่างลดลง จนมืดวันแรม 15 ค่ำ','เปลี่ยนรูปร่างครบรอบประมาณ 29.5 วัน','ขึ้นทางทิศตะวันออก ตกทางทิศตะวันตก และขึ้นช้ากว่าเดิมประมาณวันละ 50 นาที'],
'ระบบสุริยะ':['ดวงอาทิตย์เป็นดาวฤกษ์ อยู่ศูนย์กลางระบบสุริยะ','ดาวเคราะห์ 8 ดวงจากใกล้ไปไกล: พุธ ศุกร์ โลก อังคาร พฤหัสบดี เสาร์ ยูเรนัส เนปจูน (ท่องว่า “พุธ ศุกร์ โลก อังคาร พฤหัส เสาร์ ยู เนป”)','ใหญ่ที่สุด: พฤหัสบดี | วงแหวนชัดที่สุด: เสาร์ | สีแดง: อังคาร | สว่างที่สุดเมื่อมองจากโลก: ศุกร์','ชั้นใน 4 ดวงพื้นผิวเป็นหิน ชั้นนอก 4 ดวงส่วนใหญ่เป็นแก๊ส'],
'การปรับตัวของสิ่งมีชีวิต':['สิ่งมีชีวิตมีโครงสร้างหรือพฤติกรรมที่เหมาะกับแหล่งที่อยู่ จึงอยู่รอดได้','ทะเลทราย: เก็บน้ำ ลดการเสียน้ำ (กระบองเพชร อูฐ) | ขั้วโลก: ขนหนา ไขมันหนา','น้ำ: ลำตัวเพรียว มีครีบ หรือมีช่องอากาศให้ลอย | ป่าชายเลน: รากค้ำจุน','การพรางตัวช่วยหลบศัตรูหรือซุ่มจับเหยื่อ'],
'โซ่อาหาร':['ผู้ผลิต: สร้างอาหารเองได้ (พืช สาหร่าย) อยู่ต้นโซ่อาหารเสมอ','ผู้บริโภค: กินพืช กินสัตว์ หรือกินทั้งพืชและสัตว์ | ผู้ย่อยสลาย: เห็ด รา แบคทีเรีย','ลูกศรชี้จากผู้ถูกกินไปยังผู้กิน','ถ้าสิ่งมีชีวิตตรงกลางลดลง: ตัวที่มันกินจะเพิ่มขึ้น ตัวที่กินมันจะลดลง'],
'การถ่ายทอดลักษณะทางพันธุกรรม':['ลักษณะทางพันธุกรรมถ่ายทอดจากพ่อแม่สู่ลูก เช่น ลักยิ้ม ติ่งหู การห่อลิ้น หมู่เลือด','ลักษณะที่เกิดภายหลังไม่ถ่ายทอด เช่น แผลเป็น ผมย้อม ผิวคล้ำจากแดด ทักษะที่ฝึก','พืชและสัตว์ก็ถ่ายทอดลักษณะ เช่น สีดอก สีขน'],
'การเปลี่ยนแปลงของสาร':['ได้รับความร้อน: หลอมเหลว (แข็ง → เหลว) กลายเป็นไอ (เหลว → แก๊ส) ระเหิด (แข็ง → แก๊ส)','สูญเสียความร้อน: แข็งตัว (เหลว → แข็ง) ควบแน่น (แก๊ส → เหลว)','การเปลี่ยนแปลงที่เกิดสารใหม่ (เคมี): สังเกตจากสีเปลี่ยน มีฟองแก๊ส มีกลิ่นใหม่ เช่น สนิม การเผา','การละลายและการเปลี่ยนสถานะไม่เกิดสารใหม่ และผันกลับได้'],
'แรงและแรงลัพธ์':['แรงทิศเดียวกัน: นำขนาดมาบวกกัน','แรงทิศตรงข้าม: นำขนาดมาลบกัน ทิศตามแรงที่มากกว่า','แรงลัพธ์เป็นศูนย์: วัตถุที่อยู่นิ่งจะอยู่นิ่งต่อไป'],
'แรงเสียดทาน':['แรงเสียดทานต้านการเคลื่อนที่ เกิดระหว่างผิวสัมผัส','ผิวยิ่งหยาบ แรงเสียดทานยิ่งมาก | น้ำหนักกดยิ่งมาก แรงเสียดทานยิ่งมาก','เพิ่มแรงเสียดทาน: ดอกยาง พื้นรองเท้ามีปุ่ม | ลดแรงเสียดทาน: น้ำมันหล่อลื่น ตลับลูกปืน'],
'เสียง':['เสียงเกิดจากการสั่นของวัตถุ และต้องมีตัวกลาง (เคลื่อนที่ในสุญญากาศไม่ได้)','เสียงเคลื่อนที่ผ่านของแข็งเร็วที่สุด รองลงมาคือของเหลว และแก๊ส','ระดับเสียง (สูงต่ำ) ขึ้นกับความถี่: สั้น ตึง เล็ก → เสียงสูง','ความดังขึ้นกับพลังงานการสั่น: ดีดแรง → ดัง วัดเป็นเดซิเบล เกิน 85 เดซิเบลนาน ๆ เป็นอันตราย'],
'ดาวและกลุ่มดาว':['ดาวฤกษ์มีแสงในตัวเอง ดาวเคราะห์ไม่มี','สีของดาวฤกษ์บอกอุณหภูมิ: น้ำเงิน (ร้อนสุด) ขาว เหลือง ส้ม แดง (เย็นสุด)','กลุ่มดาวหมีใหญ่และกลุ่มดาวค้างคาวใช้หาดาวเหนือ ซึ่งบอกทิศเหนือ','ดาวขึ้นทางตะวันออก ตกทางตะวันตก เพราะโลกหมุนรอบตัวเอง'],
'น้ำและวัฏจักรน้ำ':['น้ำบนโลกประมาณร้อยละ 97 เป็นน้ำเค็ม น้ำจืดมีเพียงประมาณร้อยละ 3','วัฏจักรน้ำ: ระเหย → ควบแน่นเป็นเมฆ → ตกเป็นฝน → ไหลกลับแหล่งน้ำ','เมฆ หมอก น้ำค้าง เกิดจากไอน้ำควบแน่น ต่างกันที่ตำแหน่ง (สูง / ใกล้พื้น / เกาะผิววัตถุ)','หิมะและน้ำค้างแข็งเกิดเมื่ออากาศเย็นจัด | ลูกเห็บเกิดในเมฆฝนฟ้าคะนอง'],
'สารอาหาร':['อาหารหลัก 5 หมู่: 1 โปรตีน 2 คาร์โบไฮเดรต 3 แร่ธาตุ (ผัก) 4 วิตามิน (ผลไม้) 5 ไขมัน','โปรตีนสร้างและซ่อมแซมร่างกาย | คาร์โบไฮเดรตและไขมันให้พลังงาน','ขาดวิตามินซี → เลือดออกตามไรฟัน | ขาดไอโอดีน → คอพอก | ขาดวิตามินเอ → ตาบอดกลางคืน | ขาดวิตามินบีหนึ่ง → เหน็บชา'],
'ระบบย่อยอาหาร':['ทางเดินอาหาร: ปาก → หลอดอาหาร → กระเพาะอาหาร → ลำไส้เล็ก → ลำไส้ใหญ่ → ทวารหนัก','แป้งเริ่มย่อยที่ปาก | โปรตีนเริ่มย่อยที่กระเพาะอาหาร | ย่อยเสร็จและดูดซึมที่ลำไส้เล็ก','ลำไส้ใหญ่ดูดซึมน้ำ | ตับสร้างน้ำดีช่วยให้ไขมันแตกตัว | ตับอ่อนสร้างน้ำย่อย'],
'การแยกสารผสม':['เลือกวิธีจากสมบัติที่ต่างกันของสาร','หยิบออก (ชิ้นใหญ่) | ร่อน (ขนาดต่างกัน) | แม่เหล็ก (มีเหล็ก)','รินออก (ตะกอนอยู่ก้นภาชนะ) | กรอง (ของแข็งไม่ละลายน้ำ) | ตกตะกอนด้วยสารส้ม (น้ำขุ่น)','สารที่ละลายน้ำแล้วกรองไม่ได้ ต้องใช้การระเหยแห้ง'],
'ไฟฟ้าสถิต':['เกิดจากการขัดสีวัตถุ 2 ชนิด ทำให้มีประจุไฟฟ้าสะสม','ประจุชนิดเดียวกันผลักกัน ประจุต่างชนิดดึงดูดกัน','วัตถุที่มีประจุดึงดูดวัตถุที่เป็นกลางได้ เช่น หวีดูดเศษกระดาษ'],
'วงจรไฟฟ้า':['วงจรไฟฟ้าอย่างง่าย: แหล่งพลังงาน (ถ่านไฟฉาย) สายไฟ สวิตช์ และเครื่องใช้ไฟฟ้า','ถ่านไฟฉายต่ออนุกรม: ความต่างศักย์รวมเท่ากับผลบวก (1.5 + 1.5 = 3 โวลต์)','หลอดไฟต่ออนุกรม: ขาดหนึ่งดวงดับหมด | ต่อขนาน: ขาดหนึ่งดวงดวงอื่นยังสว่าง','แม่เหล็กไฟฟ้าเกิดเมื่อมีกระแสไฟฟ้าไหลผ่านขดลวด พันรอบมากขึ้นแรงขึ้น'],
'ปรากฏการณ์เงาและอุปราคา':['เงามืด: ไม่มีแสงตกถึงเลย | เงามัว: มีแสงตกถึงบางส่วน','สุริยุปราคา: ดวงอาทิตย์ – ดวงจันทร์ – โลก เกิดวันแรม 15 ค่ำ (หรือแรม 14 ค่ำ)','จันทรุปราคา: ดวงอาทิตย์ – โลก – ดวงจันทร์ เกิดวันขึ้น 15 ค่ำ'],
'เทคโนโลยีอวกาศ':['จรวดส่งยานและดาวเทียมขึ้นสู่อวกาศ | กล้องโทรทรรศน์ช่วยดูวัตถุที่อยู่ไกล','ดาวเทียมสื่อสาร อุตุนิยมวิทยา สำรวจทรัพยากร (เช่น ธีออสของไทย) และนำทาง (จีพีเอส)','สถานีอวกาศนานาชาติเป็นห้องปฏิบัติการที่โคจรรอบโลก'],
'หินและซากดึกดำบรรพ์':['หินอัคนี: แมกมาหรือลาวาเย็นตัว (แกรนิต บะซอลต์ พัมมิซ)','หินตะกอน: ตะกอนทับถมอัดแน่น (หินทราย หินปูน หินดินดาน) มักพบซากดึกดำบรรพ์','หินแปร: ความร้อนและความดันสูง | หินปูน → หินอ่อน | หินดินดาน → หินชนวน | หินทราย → ควอตไซต์','ซากดึกดำบรรพ์บอกสภาพแวดล้อมในอดีต เช่น พบซากหอยทะเลบนเขา แปลว่าเคยเป็นทะเล'],
'ลมและมรสุม':['ลมเกิดจากอากาศเหนือบริเวณที่ร้อนกว่าลอยตัวขึ้น อากาศจากบริเวณที่เย็นกว่าเคลื่อนเข้าแทนที่','กลางวัน: ลมทะเล (ทะเล → ฝั่ง) | กลางคืน: ลมบก (ฝั่ง → ทะเล)','มรสุมตะวันตกเฉียงใต้ (กลาง พ.ค.–กลาง ต.ค.) นำฝน | มรสุมตะวันออกเฉียงเหนือ (กลาง ต.ค.–กลาง ก.พ.) นำความหนาว'],

['โซ่อาหาร','โซ่อาหาร: หญ้า → ตั๊กแตน → กบ → งู → เหยี่ยว ถ้ากบถูกจับไปเป็นจำนวนมาก ในช่วงแรกจะเกิดอะไรขึ้น','ตั๊กแตนเพิ่มขึ้น และงูลดลง',['ตั๊กแตนลดลง และงูเพิ่มขึ้น','ตั๊กแตนและงูเพิ่มขึ้นทั้งคู่','หญ้าและเหยี่ยวเพิ่มขึ้นทั้งคู่'],'กบกินตั๊กแตน เมื่อกบลดลง ตั๊กแตนจึงถูกกินน้อยลงและเพิ่มขึ้น | งูกินกบ เมื่ออาหารลดลง งูจึงลดลง'],
['โซ่อาหาร','จากโซ่อาหาร หญ้า → ตั๊กแตน → กบ → งู → เหยี่ยว สิ่งมีชีวิตใดเป็นผู้บริโภคลำดับที่ 2','กบ',['ตั๊กแตน','งู','เหยี่ยว'],'หญ้าเป็นผู้ผลิต | ตั๊กแตนเป็นผู้บริโภคลำดับที่ 1 | กบเป็นผู้บริโภคลำดับที่ 2'],
['ระบบนิเวศ','สิ่งมีชีวิตคู่ใดทำหน้าที่เป็นผู้ย่อยสลายในระบบนิเวศ','เห็ดและแบคทีเรีย',['ต้นหญ้าและสาหร่าย','กบและคางคก','นกและหนู'],'ผู้ย่อยสลายเปลี่ยนซากสิ่งมีชีวิตเป็นธาตุอาหารกลับคืนสู่ดิน | ได้แก่ เห็ด รา และแบคทีเรีย | หญ้าและสาหร่ายเป็นผู้ผลิต'],
['ความสัมพันธ์ของสิ่งมีชีวิต','ผึ้งดูดน้ำหวานจากดอกไม้ และช่วยถ่ายเรณูให้ดอกไม้ ความสัมพันธ์นี้เป็นแบบใด','ภาวะพึ่งพากัน (ได้ประโยชน์ทั้งคู่)',['ภาวะปรสิต','ภาวะล่าเหยื่อ','ภาวะอิงอาศัย (ฝ่ายหนึ่งได้ อีกฝ่ายไม่ได้ไม่เสีย)'],'ผึ้งได้อาหาร ดอกไม้ได้รับการถ่ายเรณู | ทั้งสองฝ่ายได้ประโยชน์ จึงเป็นภาวะพึ่งพากัน'],
['ความสัมพันธ์ของสิ่งมีชีวิต','ต้นกาฝากที่เกาะบนต้นมะม่วงและแย่งน้ำและอาหารจากต้นมะม่วง มีความสัมพันธ์แบบใด','ภาวะปรสิต',['ภาวะพึ่งพากัน','ภาวะอิงอาศัย','ภาวะผู้ล่ากับเหยื่อ'],'กาฝากได้ประโยชน์ ส่วนต้นมะม่วงเสียประโยชน์ | ความสัมพันธ์แบบฝ่ายหนึ่งได้และอีกฝ่ายเสียเรียกว่าภาวะปรสิต'],
['การจำแนกสิ่งมีชีวิต','สัตว์ชนิดใดเป็นสัตว์ไม่มีกระดูกสันหลัง','แมงมุม',['ปลาฉลาม','กบ','งู'],'แมงมุมมีเปลือกแข็งหุ้มด้านนอกร่างกาย ไม่มีกระดูกสันหลัง | ปลา กบ และงู ล้วนมีกระดูกสันหลัง'],
['การจำแนกสิ่งมีชีวิต','ค้างคาวจัดเป็นสัตว์เลี้ยงลูกด้วยน้ำนม เพราะเหตุใด','มีขน และเลี้ยงลูกด้วยน้ำนม',['บินได้ด้วยปีก','ออกลูกเป็นไข่','หากินในเวลากลางคืน'],'สัตว์เลี้ยงลูกด้วยน้ำนมมีขนและมีต่อมน้ำนมเลี้ยงลูก | การบินได้ไม่ใช่เกณฑ์ เพราะนกและแมลงก็บินได้'],
['การสืบพันธุ์ของพืช','หลังจากดอกไม้ได้รับการปฏิสนธิ ส่วนใดของดอกจะเจริญไปเป็นผล','รังไข่',['อับเรณู','กลีบดอก','กลีบเลี้ยง'],'รังไข่เจริญเป็นผล | ออวุลภายในรังไข่เจริญเป็นเมล็ด'],
['ทักษะกระบวนการทางวิทยาศาสตร์','นักเรียนเพาะเมล็ดถั่วเขียวชนิดเดียวกัน 3 จาน จานละ 20 เมล็ด รดน้ำวันละ 0, 10 และ 20 มิลลิลิตร แล้วนับจำนวนเมล็ดที่งอก ข้อใดคือตัวแปรต้น','ปริมาณน้ำที่รด',['จำนวนเมล็ดที่งอก','ชนิดของเมล็ดถั่ว','จำนวนเมล็ดในแต่ละจาน'],'ตัวแปรต้นคือสิ่งที่ตั้งใจเปลี่ยน ในการทดลองนี้คือปริมาณน้ำ | ตัวแปรตามคือผลที่วัดได้ คือจำนวนเมล็ดที่งอก | ชนิดเมล็ดและจำนวนเมล็ดต่อจานเป็นตัวแปรควบคุม'],
['การปรับตัวของสิ่งมีชีวิต','กระบองเพชรมีใบเปลี่ยนไปเป็นหนาม การปรับตัวนี้ช่วยให้อยู่รอดในทะเลทรายได้อย่างไร','ลดการสูญเสียน้ำทางใบ',['เพิ่มการสังเคราะห์ด้วยแสงทางใบ','ดูดน้ำจากอากาศผ่านหนาม','ทำให้ลำต้นสูงเร็วขึ้น'],'ใบที่เป็นหนามมีพื้นที่ผิวน้อย จึงคายน้ำน้อย | ลำต้นสีเขียวอวบน้ำทำหน้าที่สังเคราะห์ด้วยแสงและเก็บน้ำแทน'],
['การถ่ายทอดลักษณะทางพันธุกรรม','ลักษณะใดถ่ายทอดทางพันธุกรรมจากพ่อแม่สู่ลูกได้','การมีติ่งหูหรือไม่มีติ่งหู',['รอยแผลเป็นที่แขน','สีผมที่ย้อมมา','กล้ามเนื้อที่ได้จากการออกกำลังกาย'],'ติ่งหูเป็นลักษณะที่ถูกกำหนดโดยยีน | รอยแผลเป็น สีผมที่ย้อม และกล้ามเนื้อจากการฝึก เกิดภายหลัง จึงไม่ถ่ายทอดสู่ลูก'],
// ---------- ฟิสิกส์ ----------
['แรงลัพธ์','นักเรียนสองคนดึงกล่องใบเดียวกัน คนหนึ่งดึงไปทางขวา 30 นิวตัน อีกคนดึงไปทางซ้าย 12 นิวตัน แรงลัพธ์เป็นเท่าใด','18 นิวตัน ไปทางขวา',['42 นิวตัน ไปทางขวา','18 นิวตัน ไปทางซ้าย','12 นิวตัน ไปทางขวา'],'แรงสวนทางกันให้นำมาลบกัน: 30 − 12 = 18 นิวตัน | แรงลัพธ์มีทิศตามแรงที่มากกว่า คือทางขวา'],
['แรงเสียดทาน','แรงเสียดทานที่กระทำต่อวัตถุที่กำลังไถลบนพื้นมีทิศทางอย่างไร','ตรงข้ามกับทิศการเคลื่อนที่ของวัตถุ',['ทิศเดียวกับทิศการเคลื่อนที่ของวัตถุ','ตั้งฉากชี้ขึ้นจากพื้น','ไม่มีทิศทางแน่นอน'],'แรงเสียดทานต้านการเคลื่อนที่ จึงมีทิศตรงข้ามกับทิศที่วัตถุเคลื่อนที่'],
['แรงเสียดทาน','วิธีใดช่วยลดแรงเสียดทาน','ใส่ล้อหรือลูกปืนใต้วัตถุ',['เพิ่มน้ำหนักให้วัตถุ','ทำผิวสัมผัสให้ขรุขระ','ใช้ยางที่มีดอกยางลึก'],'ล้อและลูกปืนเปลี่ยนการไถลเป็นการกลิ้ง แรงเสียดทานจึงน้อยลง | อีก 3 ข้อเป็นการเพิ่มแรงเสียดทาน'],
['มวลและน้ำหนัก','วัตถุมีมวล 6 กิโลกรัม บนโลกมีน้ำหนัก 60 นิวตัน ถ้านำไปบนดวงจันทร์ซึ่งมีแรงโน้มถ่วง 1/6 ของโลก มวลและน้ำหนักเป็นเท่าใด','มวล 6 กิโลกรัม น้ำหนัก 10 นิวตัน',['มวล 1 กิโลกรัม น้ำหนัก 10 นิวตัน','มวล 6 กิโลกรัม น้ำหนัก 60 นิวตัน','มวล 1 กิโลกรัม น้ำหนัก 60 นิวตัน'],'มวลคือปริมาณเนื้อสาร ไม่เปลี่ยนตามสถานที่ จึงยังเป็น 6 กิโลกรัม | น้ำหนักขึ้นกับแรงโน้มถ่วง: 60 × 1/6 = 10 นิวตัน'],
['แรงพยุง','ชั่งก้อนหินในอากาศได้ 50 นิวตัน เมื่อชั่งขณะจมอยู่ในน้ำทั้งก้อนได้ 30 นิวตัน แรงพยุงของน้ำเป็นเท่าใด','20 นิวตัน',['80 นิวตัน','50 นิวตัน','30 นิวตัน'],'น้ำออกแรงพยุงดันขึ้น ทำให้อ่านค่าได้น้อยลง | แรงพยุง = 50 − 30 = 20 นิวตัน'],
['แรงพยุง','ขณะที่ขวดพลาสติกปิดฝาลอยนิ่งอยู่บนผิวน้ำ ข้อใดถูกต้อง','แรงพยุงของน้ำเท่ากับน้ำหนักของขวด',['แรงพยุงของน้ำน้อยกว่าน้ำหนักของขวด','น้ำไม่มีแรงพยุงกระทำต่อขวด','ขวดไม่มีน้ำหนักขณะลอยน้ำ'],'วัตถุลอยนิ่งได้เมื่อแรงพยุงที่ดันขึ้นเท่ากับน้ำหนักที่ดึงลง | ถ้าแรงพยุงน้อยกว่าน้ำหนัก วัตถุจะจม'],
['วงจรไฟฟ้า','ต่อหลอดไฟ 3 ดวงแบบอนุกรมกับถ่านไฟฉาย ถ้าหลอดไฟดวงหนึ่งขาด จะเกิดอะไรขึ้น','หลอดไฟดับทั้ง 3 ดวง',['ดับเฉพาะดวงที่ขาด','อีก 2 ดวงสว่างขึ้น','ดับ 2 ดวง เหลือสว่าง 1 ดวง'],'วงจรอนุกรมมีทางเดินของกระแสไฟฟ้าทางเดียว | เมื่อหลอดหนึ่งขาด วงจรเปิด กระแสไหลไม่ได้ จึงดับทั้งหมด'],
['วงจรไฟฟ้า','เหตุใดเครื่องใช้ไฟฟ้าในบ้านจึงต่อแบบขนาน','ถ้าเครื่องหนึ่งเสียหรือปิดอยู่ เครื่องอื่นยังใช้งานได้',['ประหยัดสายไฟมากที่สุด','ทำให้ทุกเครื่องเปิดและปิดพร้อมกัน','ทำให้กระแสไฟฟ้ามีทางเดินทางเดียว'],'วงจรขนานมีทางเดินของกระแสหลายทาง | แต่ละเครื่องจึงเปิดปิดได้อิสระ และได้รับแรงดันไฟฟ้าเท่ากัน'],
['วงจรไฟฟ้า','วัสดุใดเป็นตัวนำไฟฟ้า','ลวดทองแดง',['ยางลบ','แผ่นพลาสติก','ไม้บรรทัดไม้'],'โลหะ เช่น ทองแดง นำไฟฟ้าได้ดี จึงใช้ทำสายไฟ | ยาง พลาสติก และไม้เป็นฉนวนไฟฟ้า'],
['วงจรไฟฟ้า','นำถ่านไฟฉายขนาด 1.5 โวลต์ 3 ก้อน มาต่อเรียงกันแบบอนุกรม จะได้แรงดันไฟฟ้ารวมเท่าใด','4.5 โวลต์',['1.5 โวลต์','3 โวลต์','0.5 โวลต์'],'ต่อเซลล์ไฟฟ้าแบบอนุกรม แรงดันไฟฟ้ารวมเท่ากับผลบวก | 1.5 + 1.5 + 1.5 = 4.5 โวลต์'],
['แม่เหล็ก','วัตถุใดถูกแม่เหล็กดูดได้','ตะปูเหล็ก',['กระป๋องอะลูมิเนียม','ช้อนพลาสติก','แหวนทองคำ'],'แม่เหล็กดูดสารแม่เหล็ก เช่น เหล็ก นิกเกิล โคบอลต์ | อะลูมิเนียม ทองคำ และพลาสติกไม่ใช่สารแม่เหล็ก'],
['แม่เหล็ก','นำขั้วเหนือของแม่เหล็กแท่งหนึ่งเข้าใกล้ขั้วเหนือของแม่เหล็กอีกแท่ง จะเกิดอะไรขึ้น','ผลักกัน',['ดูดกัน','ไม่เกิดแรงใด ๆ','ดูดกันแล้วผลักกันสลับไปมา'],'ขั้วเหมือนกันผลักกัน ขั้วต่างกันดูดกัน | เหนือกับเหนือเป็นขั้วเหมือนกันจึงผลักกัน'],
['แม่เหล็กไฟฟ้า','วิธีใดทำให้แม่เหล็กไฟฟ้าที่พันขดลวดรอบตะปูดูดคลิปหนีบกระดาษได้มากขึ้น','เพิ่มจำนวนรอบของขดลวด',['เปลี่ยนแกนตะปูเหล็กเป็นแกนไม้','ลดจำนวนถ่านไฟฉายลง','ถอดสายไฟออกจากถ่านหนึ่งข้าง'],'เพิ่มจำนวนรอบขดลวดหรือเพิ่มกระแสไฟฟ้า ทำให้แม่เหล็กไฟฟ้าแรงขึ้น | แกนไม้ไม่ช่วยเสริมความเป็นแม่เหล็ก | ถอดสายไฟออก กระแสไม่ไหล จึงไม่เป็นแม่เหล็ก'],
['พลังงาน','ขณะเปิดพัดลมไฟฟ้า เกิดการเปลี่ยนรูปพลังงานหลักอย่างไร','พลังงานไฟฟ้า → พลังงานกล (การเคลื่อนที่)',['พลังงานกล → พลังงานไฟฟ้า','พลังงานไฟฟ้า → พลังงานเคมี','พลังงานแสง → พลังงานไฟฟ้า'],'มอเตอร์ในพัดลมรับพลังงานไฟฟ้า แล้วเปลี่ยนเป็นการหมุนของใบพัด ซึ่งเป็นพลังงานกล'],
['พลังงาน','เซลล์สุริยะเปลี่ยนพลังงานใดเป็นพลังงานใด','พลังงานแสง → พลังงานไฟฟ้า',['พลังงานไฟฟ้า → พลังงานแสง','พลังงานความร้อน → พลังงานเคมี','พลังงานเคมี → พลังงานไฟฟ้า'],'เซลล์สุริยะรับแสงจากดวงอาทิตย์แล้วผลิตไฟฟ้า | ส่วนถ่านไฟฉายเปลี่ยนพลังงานเคมีเป็นไฟฟ้า'],
['เสียง','เสียงเดินทางผ่านสิ่งใดไม่ได้','สุญญากาศ',['น้ำ','อากาศ','แท่งเหล็ก'],'เสียงต้องอาศัยตัวกลางในการเดินทาง เช่น ของแข็ง ของเหลว แก๊ส | สุญญากาศไม่มีตัวกลาง เสียงจึงเดินทางไม่ได้'],
['เสียง','ดีดเส้นเอ็นที่ขึงไว้ แล้วขึงให้ตึงขึ้นและดีดอีกครั้ง เสียงจะเปลี่ยนไปอย่างไร','เสียงสูงขึ้น',['เสียงต่ำลง','เสียงไม่เปลี่ยนแปลง','เสียงเงียบลงจนไม่ได้ยิน'],'เส้นเอ็นที่ตึงขึ้นสั่นเร็วขึ้น ความถี่จึงสูงขึ้น | ความถี่สูงทำให้ได้ยินเป็นเสียงสูง'],
['แสง','เรามองเห็นหนังสือที่วางอยู่บนโต๊ะได้ เพราะเหตุใด','แสงสะท้อนจากหนังสือเข้าสู่ตา',['ตาส่งแสงออกไปกระทบหนังสือ','หนังสือดูดกลืนแสงไว้ทั้งหมด','หนังสือเปล่งแสงออกมาเอง'],'วัตถุส่วนใหญ่ไม่มีแสงในตัว | แสงจากแหล่งกำเนิดตกกระทบวัตถุแล้วสะท้อนเข้าตา เราจึงมองเห็น'],
['แสง','ใส่ดินสอลงในแก้วน้ำ เมื่อมองจากด้านข้างจะเห็นดินสอเหมือนหักงอที่ผิวน้ำ เป็นผลจากปรากฏการณ์ใด','การหักเหของแสง',['การสะท้อนของแสง','การดูดกลืนแสง','การเกิดเงา'],'แสงเดินทางผ่านน้ำกับอากาศ ซึ่งเป็นตัวกลางต่างชนิดกัน แล้วเปลี่ยนทิศ | จึงเห็นดินสอเหมือนหักงอ'],
['ความร้อน','แช่ช้อนโลหะไว้ในน้ำร้อน สักพักด้ามช้อนที่อยู่นอกน้ำก็ร้อนขึ้น เกิดจากการถ่ายโอนความร้อนแบบใด','การนำความร้อน',['การพาความร้อน','การแผ่รังสีความร้อน','การระเหย'],'ความร้อนส่งผ่านเนื้อโลหะจากส่วนร้อนไปส่วนเย็นโดยเนื้อสารไม่ได้เคลื่อนที่ เรียกว่าการนำความร้อน | การพาความร้อนเกิดในของเหลวและแก๊ส'],
// ---------- เคมี ----------
['สถานะของสาร','สารในสถานะใดมีรูปร่างไม่แน่นอน แต่มีปริมาตรคงที่','ของเหลว',['ของแข็ง','แก๊ส','ทั้งของแข็งและแก๊ส'],'ของเหลวเปลี่ยนรูปร่างตามภาชนะ แต่ปริมาตรคงเดิม | ของแข็งมีทั้งรูปร่างและปริมาตรคงที่ | แก๊สไม่คงที่ทั้งสองอย่าง'],
['การเปลี่ยนสถานะ','ลูกเหม็นในตู้เสื้อผ้าค่อย ๆ มีขนาดเล็กลงจนหมดไป เกิดจากการเปลี่ยนสถานะแบบใด','การระเหิด',['การระเหย','การหลอมเหลว','การควบแน่น'],'ลูกเหม็นเปลี่ยนจากของแข็งเป็นแก๊สโดยตรง ไม่ผ่านการเป็นของเหลว เรียกว่าการระเหิด'],
['การเปลี่ยนสถานะ','ใส่น้ำแข็งในแก้ว สักพักมีหยดน้ำเกาะอยู่ด้านนอกแก้ว หยดน้ำนั้นมาจากไหน','ไอน้ำในอากาศควบแน่นเมื่อกระทบผิวแก้วที่เย็น',['น้ำในแก้วซึมผ่านเนื้อแก้วออกมา','น้ำแข็งระเหิดออกมานอกแก้ว','อากาศรอบแก้วหลอมเหลวเป็นน้ำ'],'ไอน้ำในอากาศเมื่อกระทบผิวแก้วที่เย็นจะคายความร้อน แล้วกลายเป็นหยดน้ำ เรียกว่าการควบแน่น'],
['การเปลี่ยนแปลงทางเคมี','ข้อใดเป็นการเปลี่ยนแปลงทางเคมี','ตะปูเหล็กเกิดสนิม',['น้ำแข็งละลายเป็นน้ำ','เกลือละลายในน้ำ','ฉีกกระดาษเป็นชิ้นเล็ก ๆ'],'สนิมเป็นสารใหม่ที่ต่างจากเหล็กเดิม จึงเป็นการเปลี่ยนแปลงทางเคมี | อีก 3 ข้อเป็นการเปลี่ยนแปลงทางกายภาพ ไม่เกิดสารใหม่'],
['การเปลี่ยนแปลงทางเคมี','ผสมเบกกิ้งโซดากับน้ำส้มสายชู แล้วเกิดฟองแก๊สจำนวนมาก ข้อใดอธิบายได้ถูกต้อง','เกิดสารใหม่ คือแก๊สคาร์บอนไดออกไซด์',['น้ำส้มสายชูเดือดกลายเป็นไอ','เป็นเพียงการเปลี่ยนสถานะของเบกกิ้งโซดา','เบกกิ้งโซดาปล่อยแก๊สออกซิเจนที่สะสมไว้ออกมา'],'การเกิดฟองแก๊สเป็นสัญญาณว่ามีสารใหม่เกิดขึ้น | เบกกิ้งโซดาทำปฏิกิริยากับกรดในน้ำส้มสายชู ได้แก๊สคาร์บอนไดออกไซด์'],
['การแยกสาร','วิธีใดเหมาะที่สุดในการแยกทรายออกจากน้ำ','การกรอง',['การระเหยแห้ง','การใช้แม่เหล็ก','การโครมาโทกราฟี'],'ทรายไม่ละลายน้ำ | เมื่อเทผ่านกระดาษกรองหรือผ้าขาวบาง ทรายจะติดค้างอยู่ น้ำไหลผ่านไป'],
['การแยกสาร','การทำนาเกลือใช้วิธีแยกสารแบบใด','การระเหยแห้ง',['การกรอง','การใช้แม่เหล็ก','การร่อน'],'เกลือละลายอยู่ในน้ำทะเล กรองไม่ได้ | ปล่อยให้แสงแดดทำให้น้ำระเหยไปจนหมด จะเหลือเกลือไว้'],
['การแยกสาร','ผงเหล็กปนอยู่กับทราย วิธีใดแยกผงเหล็กออกได้ง่ายที่สุด','ใช้แม่เหล็กดูด',['เทผ่านกระดาษกรอง','ระเหยแห้ง','ละลายน้ำแล้วตั้งทิ้งไว้'],'เหล็กเป็นสารแม่เหล็ก ส่วนทรายไม่ใช่ | จึงใช้แม่เหล็กดูดผงเหล็กออกจากทรายได้'],
['การแยกสาร','ต้องการแยกสีต่าง ๆ ที่ผสมอยู่ในหมึกปากกาเมจิกสีดำ ควรใช้วิธีใด','โครมาโทกราฟีแบบกระดาษ',['การกรอง','การใช้แม่เหล็ก','การตกตะกอน'],'หยดหมึกบนกระดาษแล้วให้น้ำหรือแอลกอฮอล์ซึมผ่าน | สีแต่ละชนิดเคลื่อนที่ไปได้ไกลไม่เท่ากัน จึงแยกออกจากกันเป็นแถบ'],
['สารละลาย','ข้อใดเป็นสารละลาย','น้ำเกลือ',['น้ำโคลน','น้ำผสมน้ำมันพืช','น้ำผสมทราย'],'สารละลายเป็นเนื้อเดียว มองไม่เห็นอนุภาคของตัวละลาย และใส ตั้งทิ้งไว้ไม่ตกตะกอน | น้ำโคลนและน้ำผสมทรายตกตะกอน ส่วนน้ำมันพืชแยกชั้นกับน้ำ'],
['สารละลาย','วิธีใดทำให้น้ำตาลทรายละลายในน้ำได้เร็วที่สุด','ใช้น้ำร้อนและคนให้ทั่ว',['ใช้น้ำเย็นจัดและวางนิ่งไว้','ใช้น้ำตาลก้อนใหญ่และวางนิ่งไว้','ใช้น้ำปริมาณน้อยลงและวางนิ่งไว้'],'อุณหภูมิที่สูงขึ้นและการคน ช่วยให้อนุภาคของน้ำตาลกระจายเข้าไปในน้ำเร็วขึ้น | ส่วนน้ำตาลก้อนใหญ่ละลายช้ากว่าเกล็ดเล็ก'],
['สารละลาย','ที่อุณหภูมิ 20 °C น้ำ 100 กรัม ละลายเกลือได้มากที่สุด 36 กรัม ถ้าใส่เกลือ 50 กรัมลงในน้ำ 100 กรัมที่อุณหภูมินี้ แล้วคนจนละลายได้มากที่สุด จะเหลือเกลือที่ไม่ละลายกี่กรัม','14 กรัม',['36 กรัม','50 กรัม','86 กรัม'],'น้ำ 100 กรัมละลายเกลือได้สูงสุด 36 กรัม | เกลือที่เหลือไม่ละลาย = 50 − 36 = 14 กรัม'],
// ---------- วิทยาศาสตร์โลกและอวกาศ ----------
['การเคลื่อนที่ของโลก','ปรากฏการณ์กลางวันและกลางคืนเกิดจากสาเหตุใด','โลกหมุนรอบตัวเอง',['โลกโคจรรอบดวงอาทิตย์','ดวงจันทร์โคจรรอบโลก','ดวงอาทิตย์หมุนรอบตัวเอง'],'โลกหมุนรอบตัวเองครบ 1 รอบในเวลาประมาณ 1 วัน | ด้านที่หันเข้าหาดวงอาทิตย์เป็นกลางวัน ด้านตรงข้ามเป็นกลางคืน'],
['การเคลื่อนที่ของโลก','ฤดูกาลบนโลกเกิดจากสาเหตุสำคัญใด','แกนโลกเอียงขณะโคจรรอบดวงอาทิตย์',['ระยะห่างระหว่างโลกกับดวงอาทิตย์เปลี่ยนไป','โลกหมุนรอบตัวเอง','ดวงจันทร์บังแสงอาทิตย์'],'แกนโลกเอียง ทำให้แต่ละช่วงของปี พื้นที่แต่ละแห่งรับแสงอาทิตย์ในมุมและระยะเวลาต่างกัน จึงเกิดฤดูกาล'],
['การเคลื่อนที่ของโลก','เรามองเห็นดวงอาทิตย์ขึ้นทางทิศตะวันออก เพราะโลกหมุนรอบตัวเองในทิศใด','จากทิศตะวันตกไปทิศตะวันออก',['จากทิศตะวันออกไปทิศตะวันตก','จากทิศเหนือไปทิศใต้','จากทิศใต้ไปทิศเหนือ'],'โลกหมุนจากตะวันตกไปตะวันออก | คนบนโลกจึงเห็นดวงอาทิตย์เหมือนเคลื่อนที่สวนทาง คือขึ้นทางตะวันออกและตกทางตะวันตก'],
['ดวงจันทร์','เหตุใดเราจึงเห็นดวงจันทร์มีรูปร่างเปลี่ยนไปในแต่ละคืน (ข้างขึ้นข้างแรม)','ดวงจันทร์โคจรรอบโลก ทำให้เห็นส่วนที่ได้รับแสงอาทิตย์ไม่เท่ากัน',['เงาของโลกบังดวงจันทร์ทุกคืน','ดวงจันทร์เปล่งแสงเองไม่เท่ากันในแต่ละคืน','เมฆบังดวงจันทร์ในรูปร่างต่างกัน'],'ดวงจันทร์สะท้อนแสงอาทิตย์ | เมื่อโคจรรอบโลก ตำแหน่งที่เปลี่ยนไปทำให้เราเห็นส่วนสว่างมากน้อยต่างกัน | เงาโลกบังดวงจันทร์เป็นจันทรุปราคา ไม่ได้เกิดทุกคืน'],
['ดวงจันทร์','สุริยุปราคาเกิดขึ้นเมื่อใด','ดวงจันทร์อยู่ระหว่างดวงอาทิตย์กับโลกในแนวเดียวกัน',['โลกอยู่ระหว่างดวงอาทิตย์กับดวงจันทร์ในแนวเดียวกัน','ดวงอาทิตย์อยู่ระหว่างโลกกับดวงจันทร์','ดวงจันทร์อยู่ห่างจากโลกมากที่สุด'],'ดวงจันทร์บังแสงอาทิตย์ เงาดวงจันทร์ตกลงบนโลก จึงเกิดสุริยุปราคา | ถ้าโลกอยู่ตรงกลาง เงาโลกบังดวงจันทร์ เรียกว่าจันทรุปราคา'],
['ระบบสุริยะ','ดาวเคราะห์ดวงใดมีขนาดใหญ่ที่สุดในระบบสุริยะ','ดาวพฤหัสบดี',['ดาวเสาร์','โลก','ดาวอังคาร'],'ดาวพฤหัสบดีเป็นดาวเคราะห์แก๊สที่ใหญ่ที่สุด | ดาวเสาร์ใหญ่เป็นอันดับ 2'],

['โซ่อาหาร','สายใยอาหาร: ข้าว → หนู → งู, ข้าว → ตั๊กแตน → กบ → งู และ หนู → เหยี่ยว ถ้างูหายไปทั้งหมด สิ่งใดน่าจะเกิดขึ้นก่อน','หนูและกบเพิ่มจำนวนขึ้น',['หนูและกบลดจำนวนลง','เหยี่ยวหายไปด้วยทันที','ตั๊กแตนเพิ่มจำนวนขึ้นมาก'],'งูกินหนูและกบ | เมื่อไม่มีงู หนูและกบจึงถูกกินน้อยลงและเพิ่มจำนวน | เหยี่ยวยังกินหนูได้ จึงไม่หายไป'],
['โซ่อาหาร','ถ้าในนาข้าวมีการใช้ยาฆ่าแมลงที่สลายตัวยาก สิ่งมีชีวิตใดน่าจะมีสารพิษสะสมในร่างกายมากที่สุด','เหยี่ยว ซึ่งเป็นผู้บริโภคลำดับสุดท้าย',['ต้นข้าว','ตั๊กแตน','จุลินทรีย์ในดิน'],'สารพิษถูกส่งต่อตามโซ่อาหารเมื่อถูกกิน | ผู้บริโภคลำดับสูงกินเหยื่อจำนวนมาก สารพิษจึงสะสมมากที่สุด'],
['ความสัมพันธ์ของสิ่งมีชีวิต','นกเอี้ยงจิกกินเห็บบนหลังควาย ทั้งนกเอี้ยงและควายได้รับผลอย่างไร','ได้ประโยชน์ทั้งสองฝ่าย',['ฝ่ายหนึ่งได้ประโยชน์ อีกฝ่ายเสียประโยชน์','ฝ่ายหนึ่งได้ประโยชน์ อีกฝ่ายไม่ได้และไม่เสีย','เสียประโยชน์ทั้งสองฝ่าย'],'นกเอี้ยงได้อาหาร | ควายได้รับการกำจัดเห็บ | จึงได้ประโยชน์ทั้งคู่'],
['ความสัมพันธ์ของสิ่งมีชีวิต','กล้วยไม้ป่าเกาะอยู่บนกิ่งของต้นไม้ใหญ่ โดยไม่ได้แย่งอาหารจากต้นไม้ ความสัมพันธ์นี้เป็นแบบใด','ภาวะอิงอาศัย (กล้วยไม้ได้ประโยชน์ ต้นไม้ไม่ได้และไม่เสีย)',['ภาวะปรสิต','ภาวะพึ่งพากัน','ภาวะล่าเหยื่อ'],'กล้วยไม้ได้ที่อยู่และได้รับแสง | ต้นไม้ไม่ได้และไม่เสียประโยชน์ | ต่างจากกาฝากซึ่งแย่งน้ำและอาหาร จึงเป็นปรสิต'],
['การปรับตัวของสิ่งมีชีวิต','หมีขั้วโลกมีขนหนาและมีไขมันใต้ผิวหนังมาก ลักษณะนี้ช่วยในเรื่องใด','รักษาความอบอุ่นของร่างกายในที่หนาวเย็น',['ช่วยให้ว่ายน้ำได้เร็วขึ้นในน้ำอุ่น','ช่วยให้หาอาหารในทะเลทรายได้','ช่วยพรางตัวในป่าเขียว'],'ขนหนาและไขมันเป็นฉนวนกันความร้อนออกจากร่างกาย | จึงอยู่รอดในขั้วโลกที่หนาวจัดได้'],
// จำแนกและพันธุกรรม
['การจำแนกสิ่งมีชีวิต','สัตว์ชนิดใดเป็นสัตว์สะเทินน้ำสะเทินบก','กบ',['จระเข้','เต่า','ปลาตีน'],'สัตว์สะเทินน้ำสะเทินบกมีผิวหนังเปียกชื้น ตัวอ่อนอยู่ในน้ำและหายใจด้วยเหงือก เมื่อโตจึงขึ้นบก | จระเข้และเต่าเป็นสัตว์เลื้อยคลาน ปลาตีนเป็นปลา'],
['การจำแนกสิ่งมีชีวิต','วาฬจัดเป็นสัตว์กลุ่มใด','สัตว์เลี้ยงลูกด้วยน้ำนม',['ปลา','สัตว์เลื้อยคลาน','สัตว์สะเทินน้ำสะเทินบก'],'วาฬหายใจด้วยปอด ออกลูกเป็นตัว และเลี้ยงลูกด้วยน้ำนม | แม้อาศัยในน้ำก็ไม่ใช่ปลา'],
['การจำแนกสิ่งมีชีวิต','พืชชนิดใดเป็นพืชดอกใบเลี้ยงเดี่ยว','ข้าวโพด',['มะม่วง','ถั่วเขียว','ชบา'],'พืชใบเลี้ยงเดี่ยวมีเส้นใบขนาน รากฝอย เช่น ข้าว ข้าวโพด หญ้า | มะม่วง ถั่วเขียว ชบา เป็นใบเลี้ยงคู่ มีเส้นใบแบบร่างแห และรากแก้ว'],
['การถ่ายทอดลักษณะทางพันธุกรรม','สิ่งที่ควบคุมลักษณะทางพันธุกรรมอยู่ที่ใด','ยีนบนโครโมโซมภายในนิวเคลียสของเซลล์',['ในน้ำเลือด','ในกล้ามเนื้อเท่านั้น','ในผิวหนังชั้นนอกเท่านั้น'],'ยีนเป็นหน่วยควบคุมลักษณะ อยู่บนโครโมโซมในนิวเคลียส | ลูกได้รับยีนครึ่งหนึ่งจากพ่อและอีกครึ่งจากแม่'],
// แรง
['แรงลัพธ์','มีแรง 3 แรงกระทำต่อกล่อง: 20 นิวตันไปทางขวา 15 นิวตันไปทางขวา และ 40 นิวตันไปทางซ้าย แรงลัพธ์เป็นเท่าใด','5 นิวตัน ไปทางซ้าย',['75 นิวตัน ไปทางขวา','5 นิวตัน ไปทางขวา','35 นิวตัน ไปทางซ้าย'],'แรงทางขวารวม 20 + 15 = 35 นิวตัน | แรงทางซ้าย 40 นิวตัน | แรงลัพธ์ 40 − 35 = 5 นิวตัน ไปทางซ้าย (ทางที่แรงมากกว่า)'],
['แรงเสียดทาน','ผลักกล่องใบเดียวกันบนพื้นแบบใด จะออกแรงน้อยที่สุด','พื้นกระเบื้องเรียบ',['พื้นทราย','พื้นหญ้า','พื้นกรวด'],'พื้นที่เรียบมีแรงเสียดทานน้อย | พื้นขรุขระ เช่น ทราย หญ้า กรวด มีแรงเสียดทานมาก ต้องออกแรงมากกว่า'],
['มวลและน้ำหนัก','บนโลก (g = 10 นิวตันต่อกิโลกรัม) วัตถุชิ้นหนึ่งหนัก 250 นิวตัน มีมวลเท่าใด','25 กิโลกรัม',['2,500 กิโลกรัม','250 กิโลกรัม','2.5 กิโลกรัม'],'น้ำหนัก = มวล × g | มวล = 250 ÷ 10 = 25 กิโลกรัม'],
['แรงพยุง','ไข่ไก่จมในน้ำจืด แต่ลอยได้ในน้ำเกลือเข้มข้น เพราะเหตุใด','น้ำเกลือมีความหนาแน่นมากกว่า จึงให้แรงพยุงมากกว่า',['ไข่มีน้ำหนักลดลงเมื่ออยู่ในน้ำเกลือ','น้ำเกลือทำให้แรงโน้มถ่วงลดลง','เกลือเกาะเปลือกไข่ทำให้ไข่เบาลง'],'น้ำหนักของไข่เท่าเดิม | ของเหลวที่หนาแน่นกว่าให้แรงพยุงมากกว่า | เมื่อแรงพยุงเท่ากับน้ำหนักของไข่ ไข่จึงลอย'],
['แรงพยุง','ก้อนดินน้ำมันจมน้ำ แต่เมื่อปั้นดินน้ำมันก้อนเดิมเป็นรูปเรือกลับลอยน้ำได้ เพราะเหตุใด','รูปเรือแทนที่น้ำได้มากขึ้น จึงได้แรงพยุงมากขึ้น',['ดินน้ำมันมีมวลลดลง','ดินน้ำมันมีน้ำหนักลดลง','ดินน้ำมันเปลี่ยนเป็นสารชนิดใหม่'],'มวลและน้ำหนักเท่าเดิม | รูปเรือมีส่วนที่จมน้ำกว้าง แทนที่น้ำได้มาก แรงพยุงจึงมากพอจะเท่ากับน้ำหนัก | เรือเหล็กลอยได้ด้วยหลักเดียวกัน'],
// ไฟฟ้าและแม่เหล็ก
['วงจรไฟฟ้า','วงจรหนึ่งมีหลอดไฟ A ต่ออนุกรมกับหลอดไฟ B และ C ซึ่งต่อขนานกันอยู่ ถ้าหลอด B ขาด จะเกิดอะไรขึ้น','หลอด A และ C ยังสว่าง',['หลอดไฟดับทั้งหมด','สว่างเฉพาะหลอด A','สว่างเฉพาะหลอด C'],'กระแสไฟฟ้าผ่าน A แล้วแยกไปทาง B และ C | เมื่อ B ขาด กระแสยังไหลผ่านทาง C ได้ | วงจรยังครบ A และ C จึงยังสว่าง'],
['วงจรไฟฟ้า','ฟิวส์ในวงจรไฟฟ้าในบ้านทำหน้าที่ใด','ตัดวงจรเมื่อกระแสไฟฟ้าไหลมากเกินไป',['เพิ่มแรงดันไฟฟ้าให้สูงขึ้น','เก็บสะสมไฟฟ้าไว้ใช้ภายหลัง','ทำให้หลอดไฟสว่างขึ้น'],'ฟิวส์ทำจากโลหะที่หลอมเหลวได้ง่าย | เมื่อกระแสมากเกินไป ฟิวส์จะร้อนและขาด ทำให้วงจรเปิด ป้องกันไฟไหม้'],
['วงจรไฟฟ้า','เหตุใดจึงไม่ควรจับสวิตช์ไฟฟ้าขณะที่มือเปียก','น้ำที่มีสิ่งเจือปนนำไฟฟ้าได้ จึงอาจถูกไฟฟ้าดูด',['น้ำเป็นฉนวนไฟฟ้าที่ดีมาก','สวิตช์จะเป็นสนิมทันที','ไฟฟ้าจะดับทั้งบ้าน'],'น้ำทั่วไปมีแร่ธาตุละลายอยู่ จึงนำไฟฟ้าได้ | มือเปียกทำให้กระแสไฟฟ้าผ่านเข้าร่างกายได้ง่าย อันตรายมาก'],
['แม่เหล็ก','ตัดแม่เหล็กแท่งออกเป็น 2 ท่อน จะได้ผลอย่างไร','แต่ละท่อนมีทั้งขั้วเหนือและขั้วใต้',['ท่อนหนึ่งมีแต่ขั้วเหนือ อีกท่อนมีแต่ขั้วใต้','ทั้งสองท่อนไม่เป็นแม่เหล็กอีกต่อไป','ทั้งสองท่อนมีแต่ขั้วเหนือ'],'แม่เหล็กทุกชิ้นมี 2 ขั้วเสมอ | ตัดแบ่งแล้วแต่ละชิ้นก็กลายเป็นแม่เหล็กเล็กที่มีขั้วเหนือและขั้วใต้'],
['แม่เหล็กไฟฟ้า','อุปกรณ์ใดทำงานโดยใช้แม่เหล็กไฟฟ้า','กริ่งไฟฟ้า',['หลอดไฟแบบไส้','กาต้มน้ำไฟฟ้า','ถ่านไฟฉาย'],'กริ่งไฟฟ้ามีขดลวดพันแกนเหล็ก เมื่อกระแสไหลจะเป็นแม่เหล็กดูดแผ่นเหล็กให้เคาะกระดิ่ง | หลอดไส้และกาต้มน้ำเปลี่ยนไฟฟ้าเป็นแสงและความร้อน'],
// พลังงาน เสียง แสง ความร้อน
['พลังงาน','ข้อใดเป็นพลังงานหมุนเวียน','พลังงานลม',['ถ่านหิน','น้ำมันดิบ','แก๊สธรรมชาติ'],'พลังงานหมุนเวียนเกิดขึ้นใหม่ได้ตลอด เช่น ลม แสงอาทิตย์ น้ำ | ถ่านหิน น้ำมัน แก๊สธรรมชาติเป็นเชื้อเพลิงซากดึกดำบรรพ์ ใช้แล้วหมดไป'],
['พลังงาน','เขื่อนผลิตไฟฟ้าโดยปล่อยน้ำจากที่สูงไปหมุนกังหัน มีการเปลี่ยนรูปพลังงานอย่างไร','พลังงานศักย์ของน้ำ → พลังงานจลน์ → พลังงานไฟฟ้า',['พลังงานไฟฟ้า → พลังงานจลน์ → พลังงานศักย์ของน้ำ','พลังงานเคมี → พลังงานความร้อน → พลังงานไฟฟ้า','พลังงานแสง → พลังงานเคมี → พลังงานไฟฟ้า'],'น้ำที่อยู่สูงมีพลังงานศักย์ | เมื่อไหลลงมาเปลี่ยนเป็นพลังงานจลน์หมุนกังหัน | เครื่องกำเนิดไฟฟ้าเปลี่ยนเป็นพลังงานไฟฟ้า'],
['เสียง','เคาะโต๊ะเบา ๆ แล้วเอาหูแนบโต๊ะ จะได้ยินเสียงชัดกว่าตอนไม่แนบหู เพราะเหตุใด','เสียงเดินทางผ่านของแข็งได้ดีกว่าอากาศ',['เสียงเดินทางผ่านอากาศไม่ได้','โต๊ะขยายเสียงด้วยไฟฟ้า','การแนบหูทำให้เสียงสูงขึ้น'],'อนุภาคของของแข็งอยู่ชิดกัน ส่งต่อการสั่นได้ดี | เสียงจึงผ่านเนื้อโต๊ะมาถึงหูได้ชัดกว่าผ่านอากาศ'],
['เสียง','เหตุใดเราจึงเห็นฟ้าแลบก่อนได้ยินเสียงฟ้าร้อง','แสงเดินทางเร็วกว่าเสียงมาก',['เสียงเดินทางเร็วกว่าแสง','ฟ้าแลบเกิดก่อนฟ้าร้องเสมอหลายนาที','ตาของคนทำงานเร็วกว่าหู'],'ฟ้าแลบและฟ้าร้องเกิดพร้อมกัน | แสงเร็วประมาณ 300,000 กิโลเมตรต่อวินาที เสียงเร็วประมาณ 340 เมตรต่อวินาที | แสงจึงมาถึงก่อน'],
['แสง','เราเห็นใบไม้เป็นสีเขียว เพราะเหตุใด','ใบไม้สะท้อนแสงสีเขียว และดูดกลืนแสงสีอื่นไว้',['ใบไม้ดูดกลืนแสงสีเขียวไว้ทั้งหมด','ใบไม้เปล่งแสงสีเขียวออกมาเอง','ใบไม้สะท้อนแสงทุกสีเท่ากัน'],'แสงขาวประกอบด้วยหลายสี | วัตถุมีสีตามแสงที่มันสะท้อนเข้าตา | ใบไม้สะท้อนสีเขียว จึงเห็นเป็นสีเขียว'],
['ความร้อน','เวลากลางวันริมทะเลมีลมพัดจากทะเลเข้าหาฝั่ง (ลมทะเล) เพราะเหตุใด','พื้นดินร้อนเร็วกว่าน้ำ อากาศเหนือพื้นดินจึงลอยตัวขึ้น อากาศจากทะเลไหลเข้ามาแทน',['น้ำทะเลร้อนเร็วกว่าพื้นดิน','ดวงจันทร์ดึงอากาศเข้าหาฝั่ง','ต้นไม้บนบกดูดอากาศเข้ามา'],'กลางวันพื้นดินร้อนเร็ว อากาศร้อนขยายตัวและลอยขึ้น | อากาศที่เย็นกว่าเหนือทะเลไหลเข้ามาแทนที่ | เป็นการพาความร้อน (กลางคืนจะกลับกันเป็นลมบก)'],
// สารและการเปลี่ยนแปลง
